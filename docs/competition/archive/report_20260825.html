额外支付相当于商品价款三倍的赔偿金。这一规定旨在通过提高违法成本来遏制商业欺诈，保护消费者合法权益。同时，法律设定了最低赔偿额度（500元），以确保在小额消费纠纷中，惩罚性赔偿仍能发挥实质性的威慑和补偿作用，避免因基数过小导致赔偿金额过低而失去惩戒意义。\n\n【依据法条】\n《中华人民共和国消费者权益保护法》第五十五条\n「经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。」", "trust": 86.5, "cite": 1.0, "match": true, "rank": null, "faith": 1.0, "ms": 4561.2}, "rag": {"response": "【结论】\n经营者提供商品有欺诈行为的，增加赔偿金额为消费者购买价款的三倍。若增加赔偿的金额不足五百元，则按五百元计算。\n\n【法律分析】\n根据《消费者权益保护法》的规定，当经营者在提供商品或服务过程中存在欺诈行为时，需承担惩罚性赔偿责任。法律逻辑在于通过加重经营者的违法成本来保护消费者权益并遏制欺诈行为。具体的计算标准是“退一赔三”，即在退还货款或赔偿实际损失的基础上，额外增加赔偿金额为消费者购买商品价款或者接受服务费用的三倍。同时，为了保障小额消费维权的实效性，法律设定了最低赔偿额度，即如果计算出的三倍金额低于五百元，则直接赔偿五百元。\n\n【依据法条】\n《消费者权益保护法》第五十五条\n原文：经营者提供商品或者服务有欺诈行为的，应当\n按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消\n费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金\n额不足五百元的，为五百元。法律另有规定的，依照其规定。\n经营者明知商品或者服务存在缺陷，仍然向消费者提供，造\n成消费者或者其他受害人死亡或者健康严重损害的，受害人有权\n要求经营者依照本法第四十九条、第五十一条等法律规定赔偿损\n失，并有权要求所受", "trust": 78.2, "cite": 0.5399, "match": true, "rank": 1, "faith": 0.0, "ms": 11630.2}, "full": {"response": "【结论】\n经营者提供商品有欺诈行为的，增加赔偿金额为消费者购买商品的价款的三倍；若增加赔偿金额不足五百元，则按五百元计算。\n\n【法律分析】\n该问题适用惩罚性赔偿规则，核心在于认定经营者存在“欺诈行为”。一旦构成欺诈，消费者有权要求在退还货款等基础救济之外，另行主张价款三倍的增加赔偿，且该增加赔偿设有五百元的最低保底标准，以保障小额消费维权的有效性。需要注意的是，若经营者系明知商品存在缺陷仍向消费者提供并造成死亡或健康严重损害的，则不再适用前述三倍规则，而应依照《消费者权益保护法》第五十五条第二款主张所受损失二倍以下的惩罚性赔偿。\n\n【依据法条】\n《消费者权益保护法》第五十五条：“经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。”", "trust": 88.3, "cite": 0.8232, "match": true, "rank": 1, "faith": 1.0, "ms": 6956.9}}}, {"id": "qa006", "prompt": "有限责任公司股东以其什么为限对公司承担责任？", "modes": {"no_rag": {"response": "【结论】\n有限责任公司股东以其**认缴的出资额**为限对公司承担责任。\n\n【法律分析】\n有限责任公司的核心特征在于“有限责任”，即公司作为独立法人，以其全部财产对公司的债务承担责任；而股东作为出资人，其风险被限定在其承诺投入公司的资本范围内。这意味着，一旦股东履行了认缴出资义务，原则上无需再用个人其他财产为公司债务买单。这里的责任界限是“认缴”而非“实缴”，即无论股东是否已实际全额缴纳出资，其对公司承担的责任上限均为其在公司章程中承诺认缴的金额。\n\n【依据法条】\n《中华人民共和国公司法》第四条\n“公司股东依法享有资产收益、参与重大决策和选择管理者等权利。公司股东以其认缴的出资额或者认购的股份为限对公司承担责任。”", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": null, "ms": 3270.8}, "rag": {"response": "【结论】\n有限责任公司股东以其认缴的出资额为限对公司承担责任。\n\n【法律分析】\n根据《公司法》关于股东有限责任的基本原则，有限责任公司具有独立的法人财产，股东作为公司的出资人，其责任范围是有限制的。具体而言，股东仅需在其承诺认缴的出资额度内承担对公司的出资义务及相应责任，一旦完成认缴义务，原则上不再以个人其他财产对公司债务负责。这一规定确立了公司独立人格与股东有限责任的基础，区别于股份有限公司股东以认购的股份为限承担责任的情形。\n\n【依据法条】\n《公司法》第四条\n“有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\n公司股东对公司依法享有资产收益、参与重大决策和选择管理者等权利。”", "trust": 85.5, "cite": 0.6718, "match": true, "rank": 1, "faith": null, "ms": 6829.4}, "full": {"response": "【结论】\n有限责任公司股东以其认缴的出资额为限对公司承担责任。\n\n【法律分析】\n该规则确立了有限责任公司股东的有限责任原则，即股东对公司债务或亏损的责任边界仅限于其承诺向公司缴纳的出资总额，而非实缴出资额或个人全部财产。这一制度安排将股东个人财产与公司财产相隔离，是公司法人的独立地位与股东权利（如资产收益、参与重大决策等）相对应的基础；但若股东存在滥用法人独立地位逃避债务等法定例外情形，则可能突破该责任限制而承担连带责任。\n\n【依据法条】\n《公司法》第四条：“有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。公司股东对公司依法享有资产收益、参与重大决策和选择管理者等权利。”", "trust": 90.0, "cite": 0.92, "match": true, "rank": 1, "faith": null, "ms": 3923.5}}}, {"id": "qa007", "prompt": "劳动合同解除后什么情况下用人单位应支付经济补偿？", "modes": {"no_rag": {"response": "【结论】\n用人单位在因自身原因（如协商一致、裁员、客观情况变化）或劳动者被迫解除（如欠薪、未缴社保）等法定情形下解除劳动合同时，应支付经济补偿。若劳动者因严重违纪等过错被辞退，或劳动者主动辞职且无用人单位违法情形，则无需支付。\n\n【法律分析】\n判断用人单位是否需支付经济补偿，核心在于区分劳动合同解除的“发起方”及“解除事由”。\n\n首先，若由用人单位提出解除，通常需支付补偿。这包括双方协商一致解除（由单位提议）、单位因劳动者非过错性原因（如医疗期满不能工作、不胜任工作经培训仍不胜任、客观情况发生重大变化）解除，以及单位进行经济性裁员的情形。此外，若劳动合同期满，除用人单位维持或提高条件续订而劳动者拒绝外，单位不再续订的也需支付补偿。\n\n其次，若由劳动者提出解除，需视具体情况而定。如果是因为用人单位存在违法行为（如未及时足额支付劳动报酬、未依法缴纳社会保险费、规章制度违法损害权益等），劳动者据此被迫解除合同，用人单位必须支付经济补偿。反之，如果劳动者仅因个人原因主动辞职，且用人单位无上述违法行为，则用人单位无需支付经济补偿。\n\n最后，若解除原因是劳动者存在严重过错（如严重违反规章制度、严重", "trust": 86.5, "cite": 1.0, "match": true, "rank": null, "faith": 1.0, "ms": 12452.8}, "rag": {"response": "【结论】\n用人单位在协商一致解除（由单位提出）、非过失性辞退、经济性裁员、劳动者因单位违法被迫解除、特定情形下合同终止等情况下，应当向劳动者支付经济补偿。补偿标准通常按劳动者在本单位工作年限，每满一年支付一个月工资计算。\n\n【法律分析】\n根据法律规定，用人单位支付经济补偿的情形主要涵盖以下几类逻辑：\n\n首先，基于双方合意或单位主导的解除。若用人单位主动提出并与劳动者协商一致解除劳动合同，或者用人单位依据法定程序进行非过失性辞退（如医疗期满、不能胜任工作等）及经济性裁员，均须支付经济补偿。\n\n其次，基于劳动者被迫解除。若用人单位存在未及时足额支付劳动报酬、未依法缴纳社保等违法行为，劳动者依照法律规定单方解除劳动合同的，用人单位仍需支付经济补偿。\n\n再次，基于劳动合同的终止。除用人单位维持或提高条件续订而劳动者拒绝的情形外，固定期限劳动合同期满终止的，用人单位应支付补偿。此外，以完成一定工作任务为期限的合同因任务完成而终止，以及因用人单位被宣告破产、吊销执照等原因导致合同终止的，也属于支付范围。劳务派遣关系中的解除或终止同样适用上述规则。\n\n最后，关于计算标准。经济补偿按劳动者在本单位工作", "trust": 75.9, "cite": 0.4155, "match": true, "rank": 1, "faith": 0.8, "ms": 18964.0}, "full": {"response": "【结论】\n用人单位应支付经济补偿的情形主要包括：劳动者依《劳动合同法》第三十八条解除、用人单位提出并协商一致解除、用人单位依第四十条或第四十一条第一款解除、特定情形下固定期限劳动合同终止、以及法律行政法规规定的其他情形；补偿标准按在本单位工作年限每满一年支付一个月工资计算。\n\n【法律分析】\n经济补偿的支付义务主体是用人单位，触发条件以“非因劳动者过错导致劳动关系结束”为核心逻辑。具体包括：劳动者因用人单位违法或违约（对应第三十八条）而被迫解除；用人单位主动提出并与劳动者协商一致解除；用人单位基于无过失性辞退（第四十条）或经济性裁员（第四十一条第一款）单方解除；以及固定期限合同到期终止时，除非用人单位维持或提高原约定条件续订而劳动者拒绝，否则仍需补偿。此外，法律、行政法规规定的其他情形亦应支付。补偿金额与劳动者在本单位连续工作年限挂钩，并对高收入劳动者设置三倍社平工资上限及十二年封顶规则；月工资口径为解除或终止前十二个月平均工资。劳务派遣及以完成一定工作任务为期限的合同终止，也分别适用上述补偿规则。\n\n【依据法条】\n《劳动合同法》第四十六条：“有下列情形之一的，用人单位应当向劳动者支付经", "trust": 83.2, "cite": 0.8206, "match": true, "rank": 1, "faith": 1.0, "ms": 12507.2}}}, {"id": "qa008", "prompt": "房屋租赁合同到期后承租人继续使用租赁物，出租人未异议的，原合同效力如何？", "modes": {"no_rag": {"response": "【结论】\n原租赁合同继续有效，但租赁期限变为不定期。这意味着双方仍受原合同租金、用途等条款约束，但任何一方均可随时解除合同，只需在合理期限之前通知对方。\n\n【法律分析】\n当房屋租赁合同期限届满，承租人继续使用租赁物且出租人未提出异议时，法律推定双方以行为达成了续租的合意。此时，原租赁合同并未终止，而是继续有效，双方原有的权利义务关系（如租金标准、维修责任等）得以延续。\n\n然而，这种延续存在一个关键的法律后果变化：租赁期限由“定期”转变为“不定期”。在不定期租赁关系中，为了平衡双方利益，法律赋予当事人任意解除权。即出租人或承租人均有权随时提出解除合同，但必须履行“在合理期限之前通知对方”的义务，以给予对方必要的准备时间。若一方未履行通知义务直接解除或收回房屋，可能构成违约。\n\n【依据法条】\n《中华人民共和国民法典》第七百三十四条\n“租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。”\n\n《中华人民共和国民法典》第七百三十条\n“当事人对租赁期限没有约定或者约定不明确，依据本法第五百一十条的规定仍不能确定的，视为不定期租赁；当事人可以随时解除", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.5, "ms": 5189.3}, "rag": {"response": "【结论】\n原租赁合同继续有效，但租赁期限变为不定期。此外，房屋承租人在同等条件下享有优先承租的权利。\n\n【法律分析】\n根据法律规定，当房屋租赁期限届满后，若承租人继续使用租赁物且出租人未提出异议，法律推定双方同意延续租赁关系，因此原租赁合同依然有效。然而，这种延续并非按照原定期限执行，而是转化为“不定期租赁”，这意味着双方均可随时解除合同（需给予合理通知）。同时，针对房屋租赁这一特定类型，法律特别赋予了承租人在租赁期满后的优先承租权，即在同等条件下，承租人有权优先于第三人续租该房屋。\n\n【依据法条】\n《民法典》第七百三十四条\n“租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。\n\n租赁期限届满，房屋承租人享有以同等条件优先承租的权利。”", "trust": 83.3, "cite": 0.5491, "match": true, "rank": 1, "faith": 0.5, "ms": 6301.2}, "full": {"response": "【结论】\n房屋租赁合同到期后承租人继续使用且出租人未提出异议的，原租赁合同继续有效，但租赁期限依法转为不定期。在此情形下，双方仍受原合同条款约束，但任何一方均可在合理期限前通知对方解除合同。\n\n【法律分析】\n该情形属于租赁期满后的法定续租效果：承租人继续占有使用、出租人以“不提出异议”的方式默示同意，使原合同关系延续而非终止。其核心法律后果是“合同有效+期限变为不定期”，即租金、用途、维修等原约定原则上仍适用，但因期限不确定，不再受固定期限保护，当事人可依法随时解除并应给予合理通知期。需注意，本条仅解决“继续使用且无异议”时的效力与期限问题；若出租人已明确反对或要求返还，则不适用该续租规则，承租人应依约返还房屋。此外，即便未办理登记备案，也不影响上述合同效力判断。\n\n【依据法条】\n《民法典》第七百三十四条：“租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。”", "trust": 90.0, "cite": 0.92, "match": true, "rank": 1, "faith": null, "ms": 5246.8}}}, {"id": "qa009", "prompt": "合同违约的损失赔偿应当相当于因违约所造成的损失，是否包括合同履行后可以获得的利益？", "modes": {"no_rag": {"response": "【结论】\n是的，合同违约的损失赔偿包括合同履行后可以获得的利益（即可得利益损失）。但赔偿总额不得超过违约一方在订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n【法律分析】\n根据中国法律规定，违约损害赔偿遵循“完全赔偿原则”，旨在使非违约方的利益状态恢复到合同如同被正常履行时的水平。因此，损失赔偿范围不仅包含因违约造成的现有财产减少（直接损失），也明确包含合同履行后本可以获得的利益（间接损失或可得利益）。\n\n然而，这种赔偿并非无限制。法律设定了“可预见性规则”作为上限，即赔偿额不得超过违约方在订立合同时能够预见或应当预见的损失范围。此外，非违约方还负有减损义务，若未采取适当措施致使损失扩大，不得就扩大的损失请求赔偿。\n\n【依据法条】\n《中华人民共和国民法典》第五百八十四条\n「当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。」", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.4, "ms": 4696.5}, "rag": {"response": "【结论】\n是的，合同违约的损失赔偿额应当相当于因违约所造成的损失，明确包括合同履行后可以获得的利益。但该赔偿总额不得超过违约一方在订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n【法律分析】\n根据法律规定，违约损害赔偿遵循完全赔偿原则，旨在填补非违约方因违约行为遭受的全部损失。这里的“损失”不仅包含现有财产的减少（直接损失），也涵盖假如合同正常履行非违约方本应获得但因违约而落空的利益（即可得利益或预期利益）。\n\n然而，这种赔偿并非无限制。首先，它受到“可预见性规则”的限制，即赔偿范围仅限于违约方在订立合同时能够预见或应当预见的损失范围。其次，非违约方负有减损义务，若未采取适当措施防止损失扩大，不得就扩大的部分请求赔偿。最后，如果可得利益难以确定，法院可综合违约方获利、过错程度等因素，依据公平和诚信原则进行裁量。\n\n【依据法条】\n《民法典》第五百八十四条\n“当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。”\n\n《民", "trust": 81.4, "cite": 0.4422, "match": true, "rank": 2, "faith": 0.0, "ms": 17130.2}, "full": {"response": "【结论】\n包括。合同违约的损失赔偿额应当相当于因违约所造成的损失，明确包含合同履行后可以获得的利益，但不得超过违约方在订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n【法律分析】\n违约损害赔偿以“填平原则”为基础，赔偿范围不仅涵盖守约方的实际财产减少，也包括合同如正常履行本可取得的预期收益（可得利益）。但该可得利益并非无限支持：一方面受“可预见性规则”限制，即仅赔偿违约方订约时能够预见或应当预见的损失；另一方面受减损义务约束，守约方未采取适当措施导致损失扩大的部分不得请求赔偿。此外，当可得利益难以依通常方法确定时，法院可综合违约获利、过错程度等因素，依公平与诚信原则酌定，以避免举证困难导致权利落空或赔偿失衡。\n\n【依据法条】\n《民法典》第五百八十四条：“当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。”\n\n《民法典》第五百九十一条：“当事人一方违约后，对方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩", "trust": 87.4, "cite": 0.7756, "match": true, "rank": 2, "faith": 0.8, "ms": 12263.2}}}, {"id": "qa010", "prompt": "用人单位违法解除劳动合同，劳动者不要求继续履行的，用人单位应如何赔偿？", "modes": {"no_rag": {"response": "【结论】\n用人单位违法解除劳动合同且劳动者不要求继续履行的，用人单位应当向劳动者支付赔偿金。赔偿金的标准为经济补偿标准的二倍，即按劳动者在本单位工作的年限，每满一年支付两个月工资的标准向劳动者支付。\n\n【法律分析】\n在劳动关系中，若用人单位违反法律规定解除或终止劳动合同，其法律责任取决于劳动者的选择。如果劳动者不要求继续履行劳动合同，或者劳动合同已经客观上无法继续履行，用人单位不能仅支付正常的经济补偿金，而必须承担惩罚性的赔偿责任。\n\n具体的赔偿逻辑是：首先确定“经济补偿”的数额，这通常依据劳动者在单位的工作年限和离职前十二个月的平均工资计算；然后，将该经济补偿数额乘以二，得出最终的“赔偿金”。这意味着，违法解除的成本是合法解除（如协商一致或无过失性辞退）成本的两倍。需要注意的是，支付了赔偿金后，用人单位不再另行支付经济补偿金，二者不可兼得。\n\n【依据法条】\n《中华人民共和国劳动合同法》第四十八条\n「用人单位违反本法规定解除或者终止劳动合同，劳动者要求继续履行劳动合同的，用人单位应当继续履行；劳动者不要求继续履行劳动合同或者劳动合同已经不能继续履行的，用人单位应当依照本法第八十七条规定", "trust": 86.5, "cite": 1.0, "match": true, "rank": null, "faith": 1.0, "ms": 7509.5}, "rag": {"response": "【结论】\n用人单位应当依照《劳动合同法》第八十七条规定，向劳动者支付相当于经济补偿标准二倍的赔偿金。若已支付该赔偿金，则不再另行支付经济补偿，且赔偿金的计算年限自用工之日起计算。\n\n【法律分析】\n当用人单位违法解除或终止劳动合同时，法律赋予劳动者选择权：可以要求继续履行合同，也可以不要求继续履行。在劳动者明确表示不要求继续履行劳动合同的情况下，用人单位的法律责任转化为金钱赔偿。根据法律规定，此时的赔偿性质为“赔偿金”，其计算标准为法定经济补偿标准的二倍。需要注意的是，赔偿金与经济补偿金不能兼得，用人单位在支付了违法解除的赔偿金后，无需再支付解除劳动合同的经济补偿。此外，在计算这笔赔偿金的工作年限时，应当从劳动者入职（用工之日）起连续计算，而非仅计算最后一段工作时间。\n\n【依据法条】\n《劳动合同法》第四十八条\n“用人单位违反本法规定解除或者终止劳动合同，劳动者要求继续履行劳动合同的，用人单位应当继续履行；劳动者不要求继续履行劳动合同或者劳动合同已经不能继续履行的，用人单位应当依照本法第八十七条规定支付赔偿金。”\n\n《劳动合同法》第八十七条\n“用人单位违反本法规定解除或者终止劳动合同的，应", "trust": 78.8, "cite": 0.5738, "match": true, "rank": 1, "faith": 0.6, "ms": 11370.2}, "full": {"response": "【结论】\n用人单位违法解除劳动合同且劳动者不要求继续履行的，用人单位应按《劳动合同法》第四十七条规定的经济补偿标准的二倍支付赔偿金；赔偿金计算年限自用工之日起计算，已支付赔偿金的不再另行支付经济补偿。\n\n【法律分析】\n在用人单位违法解除或终止劳动合同的情形下，劳动者享有选择权：可要求继续履行，也可选择不继续履行而主张金钱赔偿。当劳动者明确不要求继续履行（或合同客观上已不能继续履行）时，法律将救济方式转化为“赔偿金”，其性质是对违法解除的惩罚性给付，标准为法定经济补偿的二倍，并以劳动者在本单位的用工起始时间作为计算年限起点。为避免重复补偿，法律规定在已按违法解除标准支付赔偿金后，用人单位无需再支付通常意义上的经济补偿；该规则与合法解除情形下的经济补偿制度相区分，体现对违法行为的加重责任。\n\n【依据法条】\n《劳动合同法》第四十八条：“用人单位违反本法规定解除或者终止劳动合同，劳动者要求继续履行劳动合同的，用人单位应当继续履行；劳动者不要求继续履行劳动合同或者劳动合同已经不能继续履行的，用人单位应当依照本法第八十七条规定支付赔偿金。”\n《劳动合同法》第八十七条：“用人单位违反本法规定解除或者", "trust": 82.8, "cite": 0.7963, "match": true, "rank": 1, "faith": 0.75, "ms": 8460.3}}}, {"id": "qa011", "prompt": "职工在工作时间和工作场所内，因工作原因受到事故伤害，是否应当认定为工伤？", "modes": {"no_rag": {"response": "【结论】\n应当认定为工伤。职工在工作时间和工作场所内，因工作原因受到事故伤害的，符合法定工伤认定情形，用人单位或职工本人可依法申请工伤认定并享受相应工伤保险待遇。\n\n【法律分析】\n根据中国现行工伤保险制度，认定工伤的核心要素通常包括“工作时间”、“工作场所”和“工作原因”。用户描述的情形完全契合《工伤保险条例》中关于应当认定为工伤的首要法定情形。这意味着，只要伤害发生在规定的工作时间内、规定的工作场所中，且是由工作原因直接导致的事故伤害，社会保险行政部门即应依法作出工伤认定决定。一旦认定为工伤，职工即可依据伤残等级等具体情况，享受医疗费报销、停工留薪期工资、一次性伤残补助金等工伤保险待遇。此规定旨在保障劳动者在履行工作职责过程中遭受意外伤害时的基本权益，除非存在故意犯罪、醉酒或吸毒、自残或自杀等法定排除情形，否则不影响该认定结果。\n\n【依据法条】\n《工伤保险条例》第十四条\n「职工有下列情形之一的，应当认定为工伤：\n（一）在工作时间和工作场所内，因工作原因受到事故伤害的；\n（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；\n（三）在工作时间和工作场所内，", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.3333, "ms": 7236.3}, "rag": {"response": "【结论】\n应当认定为工伤。职工在工作时间和工作场所内，因工作原因受到事故伤害的，符合法定工伤认定情形，除非存在故意犯罪、醉酒或吸毒、自残或自杀等排除情形。\n\n【法律分析】\n根据法律规定，工伤认定的核心要素包括“工作时间”、“工作场所”以及“工作原因”。用户所述情形完全契合《工伤保险条例》第十四条第一款规定的典型工伤情形，即“三工”要素齐全，因此原则上应当认定为工伤。\n\n然而，工伤认定还需通过否定性条件的审查。依据《社会保险法》第三十七条及《工伤保险条例》第十六条，如果该事故伤害是由职工故意犯罪、醉酒或者吸毒、自残或者自杀导致的，即使满足“三工”条件，也不得认定为工伤。若不存在上述排除情形，职工经工伤认定后，可依法享受工伤保险待遇；若伤情稳定后存在残疾或影响劳动能力，还应进行劳动能力鉴定以享受相应伤残待遇。\n\n【依据法条】\n《工伤保险条例》第十四条\n原文：职工有下列情形之一的，应当认定为工伤：\n（一）在工作时间和工作场所内，因工作原因受到事故伤害的；\n（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；\n（三）在工作时间和工作场所内，因履行工作职责受到暴力", "trust": 79.7, "cite": 0.3491, "match": true, "rank": 1, "faith": 0.6, "ms": 27635.6}, "full": {"response": "【结论】\n职工在工作时间和工作场所内，因工作原因受到事故伤害的，应当认定为工伤；但若该伤害系由故意犯罪、醉酒或者吸毒、自残或者自杀导致，则不得认定为工伤。\n\n【法律分析】\n根据工伤认定的基本规则，“工作时间、工作场所、工作原因”三要素同时具备是认定工伤的核心条件，符合该情形的事故伤害原则上应纳入工伤保险保障范围，并据此享受相应待遇。然而，工伤认定并非无条件适用，即使形式上满足上述三要素，仍需审查是否存在法定排除事由：若伤亡结果与故意犯罪、醉酒或吸毒、自残或自杀等情形存在因果关系，则依法阻却工伤认定。此外，认定工伤后还需经劳动能力鉴定确认是否丧失劳动能力，才能进一步确定是否享受伤残待遇及具体等级。\n\n【依据法条】\n《工伤保险条例》第十四条：“职工有下列情形之一的，应当认定为工伤：（一）在工作时间和工作场所内，因工作原因受到事故伤害的；”\n《工伤保险条例》第十六条：“职工符合本条例第十四条、第十五条的规定，但是有下列情形之一的，不得认定为工伤或者视同工伤：（一）故意犯罪的；（二）醉酒或者吸毒的；（三）自残或者自杀的。”\n《社会保险法》第三十六条：“职工因工作原因受到事故伤害或者患职业病，且", "trust": 86.9, "cite": 0.7446, "match": true, "rank": 1, "faith": 1.0, "ms": 12888.3}}}, {"id": "qa012", "prompt": "国家实行劳动者每日工作时间不超过多少小时？", "modes": {"no_rag": {"response": "【结论】\n国家实行劳动者每日工作时间不超过8小时。这是我国标准工时制度的核心规定，旨在保障劳动者的休息权与身体健康。\n\n【法律分析】\n根据我国劳动法律法规，标准工时制度是计算加班费、安排休息休假的基础基准。法律明确规定了每日和每周的工作时间上限，其中每日工作时间不得超过8小时，平均每周工作时间不得超过40小时（注：虽然《劳动法》原文为44小时，但国务院后续规定已调整为40小时，实践中通常以40小时为标准周工时，但每日8小时的上限始终未变）。用人单位若安排劳动者超过此标准工作，需依法支付加班工资或安排补休。这一规定适用于中华人民共和国境内的企业、个体经济组织等用人单位及其劳动者。\n\n【依据法条】\n《中华人民共和国劳动法》第三十六条\n「国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。」", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 1.0, "ms": 3906.2}, "rag": {"response": "【结论】\n国家实行劳动者每日工作时间不超过八小时。\n\n【法律分析】\n根据我国现行工时制度，标准工作日时长有明确的上限规定。这一规定旨在保障劳动者的休息权与身体健康，是计算加班时间及加班费的基础标准。除非属于非全日制用工等特殊情形，否则用人单位安排劳动者每日工作超过八小时即构成延长工作时间，需遵循严格的协商程序及时长限制。\n\n【依据法条】\n《劳动法》第三十六条\n“国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。”", "trust": 81.9, "cite": 0.4708, "match": true, "rank": 1, "faith": null, "ms": 2924.9}, "full": {"response": "【结论】\n国家实行劳动者每日工作时间不超过八小时的工时制度，同时平均每周工作时间不超过四十四小时。\n\n【法律分析】\n该问题直接对应国家法定标准工时制度的上限规定。根据现行劳动基准，用人单位安排劳动者正常工作时间的日上限为八小时，这是判断是否构成延长工作时间（加班）以及核算加班工资的基础标准。需要注意的是，该条同时设定了“平均每周不超过四十四小时”的周工时上限，二者共同构成法定工时制度的完整约束；若涉及非全日制用工或计件工作等特殊情形，则需分别适用相应的特别规则，但本题所问“国家实行劳动者每日工作时间”的一般标准仍以八小时为准。\n\n【依据法条】\n《劳动法》第三十六条：“国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。”", "trust": 90.0, "cite": 0.92, "match": true, "rank": 1, "faith": null, "ms": 3864.0}}}, {"id": "qa013", "prompt": "劳动争议申请仲裁的时效期间为多久？", "modes": {"no_rag": {"response": "【结论】\n劳动争议申请仲裁的时效期间为一年。该时效期间从当事人知道或者应当知道其权利被侵害之日起计算。\n\n【法律分析】\n根据中国现行法律规定，劳动者或用人单位在发生劳动争议后，若希望通过仲裁途径解决纠纷，必须在法定的时效期间内提出申请。这一时效期间设定为一年，旨在督促权利人及时行使权利，稳定劳动关系和社会秩序。\n\n时效的起算点至关重要，即从当事人“知道或者应当知道”其权利被侵害之日开始计算。这意味着，如果侵权行为发生但当事人并不知情，时效可能尚未开始；反之，即使当事人主观上未察觉，但客观情形足以使其应当察觉时，时效即开始计算。此外，对于劳动关系存 ，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。\n\n因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼的，人民法院不", "trust": 84.9, "cite": 0.6344, "match": true, "rank": 1, "faith": 1.0, "ms": 11612.4}, "full": {"response": "【结论】\n公民直接向人民法院提起行政诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出；同时受最长起诉期限限制，因不动产提起诉讼的案件自行政行为作出之日起超过二十年、其他案件超过五年的，人民法院不予受理。\n\n【法律分析】\n该问题涉及行政诉讼的起诉期限制度，包含“主观起算的一般期限”与“客观起算的最长期限”两层规则。一般期限以当事人“知道或者应当知道”行政行为之日为起点，给予六个月起诉窗口，体现对当事人知情权与救济权的保障；但若法律对特定事项另有规定，则优先适用特别规定。与此同时，为维护行政法律关系稳定，法律设定了绝对最长保护期：不动产案件为行政行为作出之日起二十年，其他案件为五年，超过该期限即便当事人刚知晓也不得再诉。上述两重期限需同时满足，任一超期均可能导致法院不予受理或驳回起诉。\n\n【依据法条】\n《行政诉讼法》第四十六条：“公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。”\n《行政诉讼法》第四十六条：“因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼", "trust": 85.7, "cite": 0.6821, "match": true, "rank": 1, "faith": 1.0, "ms": 8061.4}}}, {"id": "qa018", "prompt": "公司不能清偿到期债务时，债权人能否要求已认缴出资但未届出资期限的股东提前缴纳出资？", "modes": {"no_rag": {"response": "【结论】\n可以。当公司不能清偿到期债务时，债权人有权要求已认缴出资但未届出资期限的股东在其未缴出资范围内对公司债务承担补充赔偿责任，即加速到期。\n\n【法律分析】\n在注册资本认缴制下，股东享有期限利益，原则上应按章程约定的期限缴纳出资。然而，为平衡股东期限利益与债权人保护，法律规定了“加速到期”制度。当公司作为债务人无法清偿到期债务，且具备破产原因但不申请破产，或者在执行程序中法院因无财产可供执行而裁定终结本次执行程序时，股东的出资义务视为提前到期。此时，债权人可以直接起诉未届出资期限的股东，要求其在未出资本息范围内对公司债务不能清偿的部分承担补充赔偿责任。这一规则旨在防止股东利用长期认缴期限逃避债务，确保公司资本充实以保障交易安全。\n\n【依据法条】\n《中华人民共和国公司法》第五十四条\n「公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。」\n\n《最高人民法院关于适用〈中华人民共和国公司法〉若干问题的规定（三）》第十三条第二款\n「公司债权人请求未履行或者未全面履行出资义务的股东在未出资本息范围内对公司债务不能清偿的部分承担补充赔偿责任的，", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.6667, "ms": 5334.8}, "rag": {"response": "【结论】\n可以。当公司不能清偿到期债务时，已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。\n\n【法律分析】\n根据法律规定，股东的出资义务通常受公司章程规定的出资期限保护（即享有期限利益）。但在特定情形下，为保护债权人利益，法律设立了出资加速到期制度。具体而言，当公司出现“不能清偿到期债务”的情形时，法律明确赋予已到期债权的债权人直接请求权，要求其向未届出资期限的股东主张提前履行出资义务。这一规定突破了股东原有的期限利益，旨在确保公司具备足够的偿债能力以保障债权人的合法权益。此时，债权人无需等待出资期限届满，即可依据法定条件行使该权利。\n\n【依据法条】\n《公司法》第五十四条\n“公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。”", "trust": 84.8, "cite": 0.6329, "match": true, "rank": 1, "faith": 0.75, "ms": 5869.3}, "full": {" 人损害的，由侵权人依法承担侵权责任；经调查难以确定具体侵权人的，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人给予补偿。可能加害的建筑物使用人补偿后，有权向侵权人追偿。”", "trust": 84.8, "cite": 0.6318, "match": true, "rank": 1, "faith": 0.5, "ms": 15074.7}}}, {"id": "qa027", "prompt": "用人单位未及时足额支付劳动报酬的，劳动者可以解除劳动合同吗？", "modes": {"no_rag": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者有权单方解除劳动合同，且无需提前30日通知，并可要求用人单位支付经济补偿。\n\n【法律分析】\n根据中国劳动法律法规，及时足额支付劳动报酬是用人单位的核心法定义务。当用人单位违反该义务时，构成了对劳动合同的根本违约，法律赋予劳动者“被迫解除权”。\n\n具体而言，劳动者依据此理由解除合同属于“即时解除”，即不需要像个人原因辞职那样提前30日书面通知用人单位，只需通知用人单位即可解除劳动关系。此外，由于解除原因是用人单位过错所致，劳动者在解除合同后，有权依据法律规定要求用人单位支付经济补偿金（通常按工作年限计算，每满一年支付一个月工资）。这一制度设计旨在保护处于弱势地位的劳动者，防止其因被拖欠工资而陷入被动。\n\n【依据法条】\n《中华人民共和国劳动合同法》第三十八条\n「用人单位有下列情形之一的，劳动者可以解除劳动合同：\n（一）未按照劳动合同约定提供劳动保护或者劳动条件的；\n（二）未及时足额支付劳动报酬的；\n（三）未依法为劳动者缴纳社会保险费的；\n（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；\n（五）因本法第二十六条第一款规定", "trust": 91.5, "cite": 1.0, "match": false, "rank": null, "faith": 0.6667, "ms": 8275.6}, "rag": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者有权依据《劳动合同法》第三十八条单方解除劳动合同。\n\n【法律分析】\n根据法律规定，及时足额支付劳动报酬是用人单位的法定义务。当用人单位违反该义务，出现拖欠或未足额支付劳动报酬的情形时，构成了劳动者单方解除劳动合同的法定事由。此时，劳动者无需与用人单位协商一致，即可直接行使解除权。这一规定旨在保护劳动者获取劳动报酬的核心权益，赋予其在雇主违约时的救济途径。\n\n【依据法条】\n《劳动合同法》第三十八条\n原文：用人单位有下列情形之一的，劳动者可以解除劳动合同:\n\n（一）未按照劳动合同约定提供劳动保护或者劳动条件的；\n\n（二）未及时足额支付劳动报酬的；\n\n（三）未依法为劳动者缴纳社会保险费的；\n\n（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；\n\n（五）因本法第二十六条第一款规定的情形致使劳动合同无效的；\n\n（六）法律、行政法规规定劳动者可以解除劳动合同的其他情形。\n\n用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的，或者用人单位违章指挥、强令冒险作业危及劳动者人身安全的，劳动者可以立即解除劳动合同，不需事先告", "trust": 85.5, "cite": 0.6678, "match": false, "rank": 5, "faith": 1.0, "ms": 8592.4}, "full": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者有权依据《劳动合同法》第三十八条单方解除劳动合同，且无需事先告知或征得用人单位同意。\n\n【法律分析】\n及时足额支付劳动报酬是用人单位的法定义务与合同核心义务。当用人单位出现拖欠或未足额支付情形时，法律赋予劳动者单方解除权作为救济手段，该解除属于因用人单位过错导致的解除，不以双方协商一致为前提，也不受预告期限制。劳动者行使该权利时，应注意保留欠薪证据并以可追溯方式通知用人单位，以便后续主张经济补偿等权益；同时，劳动者也可选择不经解除而直接申请支付令追索报酬，两条路径并行不悖但法律后果不同。\n\n【依据法条】\n《劳动合同法》第三十八条：“用人单位有下列情形之一的，劳动者可以解除劳动合同:（一）未按照劳动合同约定提供劳动保护或者劳动条件的；（二）未及时足额支付劳动报酬的；（三）未依法为劳动者缴纳社会保险费的；（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；（五）因本法第二十六条第一款规定的情形致使劳动合同无效的；（六）法律、行政法规规     series: [{
      type: "scatter", symbolSize: 18,
      data: pts,
      label: { show: true, position: "top", formatter: p => p.name, fontSize: 11 },
    }],
  });
})();

// ---------- 图 4 热力图 ----------
(function () {
  const el = document.getElementById("c_heat");
  if (!D.models.length) { el.innerHTML = "无多模型数据"; return; }
  const mets = D.heatMetrics;
  const cells = [];
  D.models.forEach((r, yi) => {
    const s = r.summary;
    mets.forEach(([key, , ], xi) => {
      let v = s[key];
      if (key === "avg_trust_score") v = v == null ? null : v / 100;
      cells.push([xi, yi, v == null ? "-" : +v.toFixed(3)]);
    });
  });
  echarts.init(el).setOption({
    tooltip: { formatter: p => `${D.models[p.value[1]].model} · ${mets[p.value[0]][1]}：${p.value[2]}` },
    grid: { left: 140 },
    xAxis: { type: "category", data: mets.map(m => m[1]) },
    yAxis: { type: "category", data: D.models.map(r => r.model) },
    visualMap: { min: 0, max: 1, calculable: true, orient: "horizontal", left: "center",
                 inRange: { color: ["#f6d5d5", "#fdf3c9", "#bfe3c0", "#2f9e44"] } },
    series: [{ type: "heatmap", data: cells, label: { show: true, fontSize: 10 } }],
  });
})();

// ---------- 图 5 检索命中率 ----------
(function () {
  const el = document.getElementById("c_hit");
  const cats = [], h1 = [], h3 = [], h5 = [];
  for (const r of D.ablation) {
    const s = r.summary;
    if (s.hit_at_1 == null) continue;
    cats.push(D.modeLabel[s.mode] || s.mode);
    h1.push(s.hit_at_1); h3.push(s.hit_at_3); h5.push(s.hit_at_5);
  }
  for (const r of D.retrieval) {
    const s = r.summary;
    cats.push("retrieval_gold(35题)");
    h1.push(s.hit_at_1); h3.push(s.hit_at_3); h5.push(s.hit_at_5);
  }
  if (!cats.length) { el.innerHTML = "无检索数据"; return; }
  echarts.init(el).setOption({
    tooltip: { trigger: "axis" }, legend: {},
    xAxis: { type: "category", data: cats },
    yAxis: { type: "value", max: 1 },
    series: [
      { name: "Hit@1", type: "bar", data: h1 },
      { name: "Hit@3", type: "bar", data: h3 },
      { name: "Hit@5", type: "bar", data: h5 },
    ],
  });
})();

// ---------- 图 6 逐题卡 ----------
(function () {
  const box = document.getElementById("cards");
  if (!D.perQuestion.length) { box.innerHTML = "无逐题数据"; return; }
  const badge = (ok, t) => ok == null ? `<span class="badge na">${t}:—</span>`
    : `<span class="badge ${ok ? "ok" : "bad"}">${t}:${ok ? "✓" : "✗"}</span>`;
  box.innerHTML = D.perQuestion.map(q => `
    <div class="qcard">
      <h3>${q.id} · ${q.prompt}</h3>
      <div class="modes">
        ${D.modes.map(m => {
          const c = q.modes[m];
          if (!c) return "";
          return `<div class="mcell"><b>${D.modeLabel[m]}</b><br>
            ${badge(c.match, "答案")}${badge(c.cite >= 0.65, "引用")}
            <span class="badge na">信任:${c.trust ?? "—"}</span>
            <span class="badge na">rank:${c.rank ?? "—"}</span>
            <div class="resp">${(c.response || "").replace(/</g, "&lt;")}</div></div>`;
        }).join("")}
      </div>
    </div>`).join("");
})();
</script>
</body>
</html>
