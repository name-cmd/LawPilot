者权益并遏制欺诈行为。具体的计算标准是“退一赔三”，即在退还货款或赔偿实际损失的基础上，额外增加赔偿金额为消费者购买商品价款或者接受服务费用的三倍。同时，为了保障小额消费维权的实效性，法律设定了最低赔偿额度，即如果计算出的三倍金额低于五百元，则直接赔偿五百元。\n\n【依据法条】\n《消费者权益保护法》第五十五条\n原文：经营者提供商品或者服务有欺诈行为的，应当\n按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消\n费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金\n额不足五百元的，为五百元。法律另有规定的，依照其规定。\n经营者明知商品或者服务存在缺陷，仍然向消费者提供，造\n成消费者或者其他受害人死亡或者健康严重损害的，受害人有权\n要求经营者依照本法第四十九条、第五十一条等法律规定赔偿损\n失，并有权要求所受", "trust": 78.2, "cite": 0.5399, "match": true, "rank": 1, "faith": 0.0, "ms": 11630.2, "tools": 0}, "full": {"response": "【结论】\n经营者提供商品有欺诈行为的，增加赔偿金额为消费者购买商品价款的三倍；若增加赔偿金额不足五百元的，为五百元。\n\n【法律分析】\n该问题核心在于惩罚性赔偿的倍数标准。根据《消费者权益保护法》第五十五条第一款的规定，当经营者存在欺诈行为时，消费者有权主张惩罚性赔偿，其计算基准为\"购买商品的价款\"的三倍。同时，法律设置了最低赔偿限额——若按三倍计算后金额不足五百元，则直接按五百元确定赔偿额，以保障小额消费场景下消费者的维权积极性。该条款仅适用于\"欺诈\"情形，与第二款规定的\"明知缺陷仍提供\"造成人身严重损害的惩罚性赔偿（二倍以下）属于不同适用场景，二者在构成要件、赔偿基准上均有区别。\n\n【依据法条】\n《消费者权益保护法》第五十五条\n原文：\"经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元。法律另有规定的，依照其规定。\"", "trust": 86.0, "cite": 0.6948, "match": true, "rank": 1, "faith": 0.5, "ms": 6226.5, "tools": 0}, "agent": {"response": "【结论】\n经营者提供商品有欺诈行为的，增加赔偿金额为消费者购买价款的三倍。若增加赔偿的金额不足五百元，则按五百元计算。\n\n【法律分析】\n根据《消费者权益保护法》的规定，当经营者在提供商品时存在欺诈行为，需承担惩罚性赔偿责任。具体的计算标准是：以消费者购买商品的价款为基数，增加赔偿该价款的三倍。这一规定旨在惩戒经营者的不诚信行为并保护消费者权益。同时，法律设定了最低赔偿限额，即如果计算出的三倍赔偿金额低于五百元，则直接赔偿五百元，以确保对小额消费欺诈的有效制约。\n\n【依据法条】\n《消费者权益保护法》第五十五条\n“经营者提供商品或者服务有欺诈行为的，应当\n按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消\n费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金\n额不足五百元的，为五百元。法律另有规定的，依照其规定。\n经营者明知商品或者服务存在缺陷，仍然向消费者提供，造\n成消费者或者其他受害人死亡或者健康严重损害的，受害人有权\n要求经营者依照本法第四十九条、第五十一条等法律规定赔偿损\n失，并有权要求所受损失二倍以下的惩罚性赔偿。”", "trust": 83.2, "cite": 0.5399, "match": true, "rank": 1, "faith": 0.0, "ms": 20886.9, "tools": 0}}}, {"id": "qa006", "prompt": "有限责任公司股东以其什么为限对公司承担责任？", "modes": {"no_rag": {"response": "【结论】\n有限责任公司股东以其**认缴的出资额**为限对公司承担责任。\n\n【法律分析】\n有限责任公司的核心特征在于“有限责任”，即公司作为独立法人，以其全部财产对公司的债务承担责任；而股东作为出资人，其风险被限定在其承诺投入公司的资本范围内。这意味着，一旦股东履行了认缴出资义务，原则上无需再用个人其他财产为公司债务买单。这里的责任界限是“认缴”而非“实缴”，即无论股东是否已实际全额缴纳出资，其对公司承担的责任上限均为其在公司章程中承诺认缴的金额。\n\n【依据法条】\n《中华人民共和国公司法》第四条\n“公司股东依法享有资产收益、参与重大决策和选择管理者等权利。公司股东以其认缴的出资额或者认购的股份为限对公司承担责任。”", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": null, "ms": 3270.8, "tools": 0}, "rag": {"response": "【结论】\n有限责任公司股东以其认缴的出资额为限对公司承担责任。\n\n【法律分析】\n根据《公司法》关于股东有限责任的基本原则，有限责任公司具有独立的法人财产，股东作为公司的出资人，其责任范围是有限制的。具体而言，股东仅需在其承诺认缴的出资额度内承担对公司的出资义务及相应责任，一旦完成认缴义务，原则上不再以个人其他财产对公司债务负责。这一规定确立了公司独立人格与股东有限责任的基础，区别于股份有限公司股东以认购的股份为限承担责任的情形。\n\n【依据法条】\n《公司法》第四条\n“有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\n公司股东对公司依法享有资产收益、参与重大决策和选择管理者等权利。”", "trust": 85.5, "cite": 0.6718, "match": true, "rank": 1, "faith": null, "ms": 6829.4, "tools": 0}, "full": {"response": "【结论】\n有限责任公司股东以其**认缴的出资额**为限对公司承担责任。\n\n【法律分析】\n该问题涉及公司股东有限责任的核心规则。根据《公司法》的规定，有限责任公司股东承担的是\"有限责任\"，即股东仅在其出资范围内对公司债务承担间接责任，而非以个人全部财产对公司债务负责。\"认缴的出资额\"是指股东在公司章程中承诺要缴纳的全部出资总额，而非实际已经缴纳的出资部分。这一规则与股份有限公司股东\"以其认购的股份为限\"承担责任相区别，体现了两种公司形态在责任承担表述上的差异。需要注意的是，该有限责任存在例外情形，如股东滥用公司法人独立地位逃避债务、出资不足等情况下，股东可能需承担连带责任。\n\n【依据法条】\n《公司法》第四条：\"有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\"", "trust": 89.7, "cite": 0.9, "match": true, "rank": 1, "faith": null, "ms": 7406.9, "tools": 0}, "agent": {"response": "【结论】\n有限责任公司股东以其认缴的出资额为限对公司承担责任。\n\n【法律分析】\n根据《公司法》关于有限责任公司的规定，股东承担的是有限责任。这意味着股东仅在其承诺向公司投入的资本额度（即认缴出资额）范围内对公司债务或责任负责，一旦完成该额度的出资义务，股东个人财产通常不再用于清偿公司债务。这一原则确立了公司法人独立地位与股东风险隔离的基础，区别于无限责任主体。\n\n【依据法条】\n《公司法》第四条\n“有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\n公司股东对公司依法享有资产收益、参与重大决策和选择管理者等权利。”", "trust": 85.5, "cite": 0.6718, "match": true, "rank": 1, "faith": null, "ms": 7212.0, "tools": 0}}}, {"id": "qa007", "prompt": "劳动合同解除后什么情况下用人单位应支付经济补偿？", "modes": {"no_rag": {"response": "【结论】\n用人单位在因自身原因（如协商一致、裁员、客观情况变化）或劳动者被迫解除（如欠薪、未缴社保）等法定情形下解除劳动合同时，应支付经济补偿。若劳动者因严重违纪等过错被辞退，或劳动者主动辞职且无用人单位违法情形，则无需支付。\n\n【法律分析】\n判断用人单位是否需支付经济补偿，核心在于区分劳动合同解除的“发起方”及“解除事由”。\n\n首先，若由用人单位提出解除，通常需支付补偿。这包括双方协商一致解除（由单位提议）、单位因劳动者非过错性原因（如医疗期满不能工作、不胜任工作经培训仍不胜任、客观情况发生重大变化）解除，以及单位进行经济性裁员的情形。此外，若劳动合同期满，除用人单位维持或提高条件续订而劳动者拒绝外，单位不再续订的也需支付补偿。\n\n其次，若由劳动者提出解除，需视具体情况而定。如果是因为用人单位存在违法行为（如未及时足额支付劳动报酬、未依法缴纳社会保险费、规章制度违法损害权益等），劳动者据此被迫解除合同，用人单位必须支付经济补偿。反之，如果劳动者仅因个人原因主动辞职，且用人单位无上述违法行为，则用人单位无需支付经济补偿。\n\n最后，若解除原因是劳动者存在严重过错（如严重违反规章制度、严重", "trust": 86.5, "cite": 1.0, "match": true, "rank": null, "faith": 1.0, "ms": 12452.8, "tools": 0}, "rag": {"response": "【结论】\n用人单位在协商一致解除（由单位提出）、非过失性辞退、经济性裁员、劳动者因单位违法被迫解除、特定情形下合同终止等情况下，应当向劳动者支付经济补偿。补偿标准通常按劳动者在本单位工作年限，每满一年支付一个月工资计算。\n\n【法律分析】\n根据法律规定，用人单位支付经济补偿的情形主要涵盖以下几类逻辑：\n\n首先，基于双方合意或单位主导的解除。若用人单位主动提出并与劳动者协商一致解除劳动合同，或者用人单位依据法定程序进行非过失性辞退（如医疗期满、不能胜任工作等）及经济性裁员，均须支付经济补偿。\n\n其次，基于劳动者被迫解除。若用人单位存在未及时足额支付劳动报酬、未依法缴纳社保等违法行为，劳动者依照法律规定单方解除劳动合同的，用人单位仍需支付经济补偿。\n\n再次，基于劳动合同的终止。除用人单位维持或提高条件续订而劳动者拒绝的情形外，固定期限劳动合同期满终止的，用人单位应支付补偿。此外，以完成一定工作任务为期限的合同因任务完成而终止，以及因用人单位被宣告破产、吊销执照等原因导致合同终止的，也属于支付范围。劳务派遣关系中的解除或终止同样适用上述规则。\n\n最后，关于计算标准。经济补偿按劳动者在本单位工作", "trust": 75.9, "cite": 0.4155, "match": true, "rank": 1, "faith": 0.8, "ms": 18964.0, "tools": 0}, "full": {"response": "【结论】\n用人单位在七种法定情形下应当向劳动者支付经济补偿，主要包括：劳动者依法被迫解除、双方协商一致由单位提出解除、单位依法单方解除、经济性裁员、固定期限劳动合同终止（特定例外除外）、因用人单位原因导致劳动合同终止等情形。经济补偿按劳动者在本单位工作年限计算，每满一年支付一个月工资。\n\n【法律分析】\n经济补偿的支付核心在于区分解除/终止劳动合同的\"归责方\"。若系用人单位原因或双方协商由单位主导解除，单位须承担补偿义务；若系劳动者主动辞职且不符合法定被迫解除条件，或单位维持/提高条件续订而劳动者拒绝的，则无需补偿。具体而言：第一，劳动者依据《劳动合同法》第三十八条（如单位拖欠工资、未缴社保等）解除，属于\"被迫解除\"，单位应补偿；第二，协商解除须由单位提出，若劳动者主动提出则无权要求补偿；第三，单位依据第四十条（无过失性解除）、第四十一条（经济性裁员）解除，均需补偿；第四，固定期限劳动合同到期终止时，原则上应补偿，但\"单位维持或提高原条件续订而劳动者不同意\"这一例外排除了单位责任；第五，因用人单位破产、吊销执照等原因终止合同的，亦应补偿。此外，以完成一定工作任务为期限的劳动合同因任务完成", "trust": 81.3, "cite": 0.7158, "match": true, "rank": 1, "faith": 0.8, "ms": 10405.1, "tools": 0}, "agent": {"response": "【结论】\n用人单位在协商一致解除（由单位提出）、劳动者因单位过错解除、非过失性辞退、经济性裁员、特定情形下合同终止等情况下，应当向劳动者支付经济补偿。补偿标准通常按劳动者在本单位工作的年限，每满一年支付一个月工资。\n\n【法律分析】\n根据法律规定，用人单位支付经济补偿的情形主要涵盖以下几类逻辑：\n1. **协商与单方解除**：若用人单位主动提出并与劳动者协商一致解除劳动合同，或者依据法律规定进行非过失性辞退（如医疗期满、不能胜任工作等）及经济性裁员，均需支付补偿。此外，若用人单位存在未及时足额支付劳动报酬等违法行为，劳动者据此解除劳动合同的，用人单位也需支付补偿。\n2. **合同终止**：固定期限劳动合同期满终止时，除非是用人单位维持或提高条件续订而劳动者拒绝，否则用人单位需支付补偿。同时，以完成一定工作任务为期限的劳动合同因任务完成而终止，以及用人单位被依法宣告破产、吊销执照等导致合同终止的，也属于支付范围。\n3. **特殊用工形式**：劳务派遣关系中，解除或终止劳动合同的经济补偿同样适用上述一般规定。\n4. **计算标准**：经济补偿按劳动者在本单位工作的年限计算，每满一年支付一个月", "trust": 76.6, "cite": 0.4513, "match": true, "rank": 1, "faith": 0.8, "ms": 31806.7, "tools": 0}}}, {"id": "qa008", "prompt": "房屋租赁合同到期后承租人继续使用租赁物，出租人未异议的，原合同效力如何？", "modes": {"no_rag": {"response": "【结论】\n原租赁合同继续有效，但租赁期限变为不定期。这意味着双方仍受原合同租金、用途等条款约束，但任何一方均可随时解除合同，只需在合理期限之前通知对方。\n\n【法律分析】\n当房屋租赁合同期限届满，承租人继续使用租赁物且出租人未提出异议时，法律推定双方以行为达成了续租的合意。此时，原租赁合同并未终止，而是继续有效，双方原有的权利义务关系（如租金标准、维修责任等）得以延续。\n\n然而，这种延续存在一个关键的法律后果变化：租赁期限由“定期”转变为“不定期”。在不定期租赁关系中，为了平衡双方利益，法律赋予当事人任意解除权。即出租人或承租人均有权随时提出解除合同，但必须履行“在合理期限之前通知对方”的义务，以给予对方必要的准备时间。若一方未履行通知义务直接解除或收回房屋，可能构成违约。\n\n【依据法条】\n《中华人民共和国民法典》第七百三十四条\n“租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。”\n\n《中华人民共和国民法典》第七百三十条\n“当事人对租赁期限没有约定或者约定不明确，依据本法第五百一十条的规定仍不能确定的，视为不定期租赁；当事人可以随时解除", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.5, "ms": 5189.3, "tools": 0}, "rag": {"response": "【结论】\n原租赁合同继续有效，但租赁期限变为不定期。此外，房屋承租人在同等条件下享有优先承租的权利。\n\n【法律分析】\n根据法律规定，当房屋租赁期限届满后，若承租人继续使用租赁物且出租人未提出异议，法律推定双方同意延续租赁关系，因此原租赁合同依然有效。然而，这种延续并非按照原定期限执行，而是转化为“不定期租赁”，这意味着双方均可随时解除合同（需给予合理通知）。同时，针对房屋租赁这一特定类型，法律特别赋予了承租人在租赁期满后的优先承租权，即在同等条件下，承租人有权优先于第三人续租该房屋。\n\n【依据法条】\n《民法典》第七百三十四条\n“租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。\n\n租赁期限届满，房屋承租人享有以同等条件优先承租的权利。”", "trust": 83.3, "cite": 0.5491, "match": true, "rank": 1, "faith": 0.5, "ms": 6301.2, "tools": 0}, "full": {"response": "【结论】\n原租赁合同继续有效，但租赁期限转为不定期。承租人在租赁期限届满后享有以同等条件优先承租的权利。\n\n【法律分析】\n该情形涉及租赁期限届满后的合同效力转化问题。当承租人继续使用租赁物且出租人未提出异议时，法律拟制双方形成默示合意，原租赁合同的权利义务关系得以延续，但租赁期限性质发生根本变化——由定期租赁转为不定期租赁。这意味着双方均可随时解除租赁关系，但出租人解除时应在合理期限之前通知承租人，以保障承租人的合理预期。同时，该条第二款单独规定了房屋承租人的优先承租权，这是基于房屋租赁的特殊性（涉及居住/经营稳定性）而设的特别保护，只要承租人主张\"同等条件\"，即可在租赁物再次出租时获得优先缔约地位。该优先权仅适用于房屋，不适用于其他租赁物。\n\n【依据法条】\n《民法典》第七百三十四条：\"租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。\n\n租赁期限届满，房屋承租人享有以同等条件优先承租的权利。\"", "trust": 90.0, "cite": 0.92, "match": true, "rank": 1, "faith": null, "ms": 4283.3, "tools": 0}, "agent": {"response": "【结论】\n原租赁合同继续有效，但租赁期限变为不定期。同时，房屋承租人在同等条件下享有优先承租的权利。\n\n【法律分析】\n根据法律规定，当房屋租赁期限届满后，若承租人继续使用租赁物且出租人未提出异议，法律推定双方有意延续租赁关系，因此原租赁合同继续有效。然而，由于双方未重新签订书面合同明确新的租赁期限，该续延后的租赁关系在法律性质上转化为“不定期租赁”。这意味着双方均可随时解除合同，但需给予对方合理的通知期。此外，针对房屋租赁的特殊性，法律还赋予了承租人在同等条件下的优先承租权，以保障其居住或经营的稳定性。需要注意的是，租赁物的返还义务仅在合同终止时才产生，而在合同继续有效期间，承租人有权继续占有使用。\n\n【依据法条】\n《民法典》第七百三十四条\n“租赁期限届满，承租人继续使用租赁物，出租人没有提出异议的，原租赁合同继续有效，但是租赁期限为不定期。\n\n租赁期限届满，房屋承租人享有以同等条件优先承租的权利。”", "trust": 84.0, "cite": 0.5882, "match": true, "rank": 1, "faith": 0.5, "ms": 13965.2, "tools": 0}}}, {"id": "qa009", "prompt": "合同违约的损失赔偿应当相当于因违约所造成的损失，是否包括合同履行后可以获得的利益？", "modes": {"no_rag": {"response": "【结论】\n是的，合同违约的损失赔偿包括合同履行后可以获得的利益（即可得利益损失）。但赔偿总额不得超过违约一方在订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n【法律分析】\n根据中国法律规定，违约损害赔偿遵循“完全赔偿原则”，旨在使非违约方的利益状态恢复到合同如同被正常履行时的水平。因此，损失赔偿范围不仅包含因违约造成的现有财产减少（直接损失），也明确包含合同履行后本可以获得的利益（间接损失或可得利益）。\n\n然而，这种赔偿并非无限制。法律设定了“可预见性规则”作为上限，即赔偿额不得超过违约方在订立合同时能够预见或应当预见的损失范围。此外，非违约方还负有减损义务，若未采取适当措施致使损失扩大，不得就扩大的损失请求赔偿。\n\n【依据法条】\n《中华人民共和国民法典》第五百八十四条\n「当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。」", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.4, "ms": 4696.5, "tools": 0}, "rag": {"response": "【结论】\n是的，合同违约的损失赔偿额应当相当于因违约所造成的损失，明确包括合同履行后可以获得的利益。但该赔偿总额不得超过违约一方在订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n【法律分析】\n根据法律规定，违约损害赔偿遵循完全赔偿原则，旨在填补非违约方因违约行为遭受的全部损失。这里的“损失”不仅包含现有财产的减少（直接损失），也涵盖假如合同正常履行非违约方本应获得但因违约而落空的利益（即可得利益或预期利益）。\n\n然而，这种赔偿并非无限制。首先，它受到“可预见性规则”的限制，即赔偿范围仅限于违约方在订立合同时能够预见或应当预见的损失范围。其次，非违约方负有减损义务，若未采取适当措施防止损失扩大，不得就扩大的部分请求赔偿。最后，如果可得利益难以确定，法院可综合违约方获利、过错程度等因素，依据公平和诚信原则进行裁量。\n\n【依据法条】\n《民法典》第五百八十四条\n“当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。”\n\n《民", "trust": 81.4, "cite": 0.4422, "match": true, "rank": 2, "faith": 0.0, "ms": 17130.2, "tools": 0}, "full": {"response": "【结论】\n合同违约的损失赔偿应当相当于因违约所造成的损失，**包括合同履行后可以获得的利益**，但不得超过违约方订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n【法律分析】\n在合同违约损害赔偿中，非违约方有权主张的损失范围涵盖实际损失与可得利益损失两部分。其中\"合同履行后可以获得的利益\"即学理上的\"可得利益\"或\"履行利益\"，是违约损害赔偿的核心内容之一，旨在使非违约方处于合同如约履行时的经济状态。但该赔偿范围受\"可预见性规则\"限制，即 残等级等具体情况，享受医疗费报销、停工留薪期工资、一次性伤残补助金等工伤保险待遇。此规定旨在保障劳动者在履行工作职责过程中遭受意外伤害时的基本权益，除非存在故意犯罪、醉酒或吸毒、自残或自杀等法定排除情形，否则不影响该认定结果。\n\n【依据法条】\n《工伤保险条例》第十四条\n「职工有下列情形之一的，应当认定为工伤：\n（一）在工作时间和工作场所内，因工作原因受到事故伤害的；\n（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；\n（三）在工作时间和工作场所内，", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.3333, "ms": 7236.3, "tools": 0}, "rag": {"response": "【结论】\n应当认定为工伤。职工在工作时间和工作场所内，因工作原因受到事故伤害的，符合法定工伤认定情形，除非存在故意犯罪、醉酒或吸毒、自残或自杀等排除情形。\n\n【法律分析】\n根据法律规定，工伤认定的核心要素包括“工作时间”、“工作场所”以及“工作原因”。用户所述情形完全契合《工伤保险条例》第十四条第一款规定的典型工伤情形，即“三工”要素齐全，因此原则上应当认定为工伤。\n\n然而，工伤认定还需通过否定性条件的审查。依据《社会保险法》第三十七条及《工伤保险条例》第十六条，如果该事故伤害是由职工故意犯罪、醉酒或者吸毒、自残或者自杀导致的，即使满足“三工”条件，也不得认定为工伤。若不存在上述排除情形，职工经工伤认定后，可依法享受工伤保险待遇；若伤情稳定后存在残疾或影响劳动能力，还应进行劳动能力鉴定以享受相应伤残待遇。\n\n【依据法条】\n《工伤保险条例》第十四条\n原文：职工有下列情形之一的，应当认定为工伤：\n（一）在工作时间和工作场所内，因工作原因受到事故伤害的；\n（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；\n（三）在工作时间和工作场所内，因履行工作职责受到暴力", "trust": 79.7, "cite": 0.3491, "match": true, "rank": 1, "faith": 0.6, "ms": 27635.6, "tools": 0}, "full": {"response": "【结论】\n职工在工作时间和工作场所内，因工作原因受到事故伤害，应当认定为工伤；且该情形不属于《社会保险法》第三十七条及《工伤保险条例》第十六条规定的排除情形，依法享受工伤保险待遇。\n\n【法律分析】\n该职工具备典型的工伤构成要件：主体为职工，时空条件为\"工作时间和工作场所内\"，因果关系为\"因工作原因受到事故伤害\"，完全符合《工伤保险条例》第十四条第（一）项的积极要件。同时，该情形不存在《社会保险法》第三十七条列举的故意犯罪、醉酒或吸毒、自残或自杀等否定性事由，也不存在《工伤保险条例》第十六条规定的排除情形。因此，该职工不仅应当认定为工伤，且经工伤认定后可依据《社会保险法》第三十六条享受工伤保险待遇；若经治疗伤情相对稳定后存在残疾、影响劳动能力的，还应依据《工伤保险条例》第二十一条进行劳动能力鉴定，进而享受相应伤残待遇。\n\n【依据法条】\n《工伤保险条例》第十四条：\"职工有下列情形之一的，应当认定为工伤：（一）在工作时间和工作场所内，因工作原因受到事故伤害的；（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；（三）在工作时间和工作场所内，因履行工作职责受到暴", "trust": 81.3, "cite": 0.4353, "match": true, "rank": 1, "faith": 0.8, "ms": 35588.7, "tools": 0}, "agent": {"response": "【结论】\n职工在工作时间和工作场所内，因工作原因受到事故伤害的，应当认定为工伤。但若存在故意犯罪、醉酒或吸毒、自残或自杀等法定排除情形，则不得认定为工伤。\n\n【法律分析】\n根据《工伤保险条例》第十四条的规定，“在工作时间和工作场所内，因工作原因受到事故伤害”是认定工伤的核心法定情形之一，满足该三要素（工作时间、工作场所、工作原因）即具备认定工伤的基础条件。然而，工伤认定并非绝对，还需结合排除性条款进行审查。依据《工伤保险条例》第十六条及《社会保险法》第三十七条，如果职工的伤亡是由故意犯罪、醉酒或者吸毒、自残或者自杀导致的，即使符合第十四条的情形，也不得认定为工伤。因此，在确认符合“三工”要素且不存在法定排除情形的前提下，该职工应当被认定为工伤，并依据《社会保险法》第三十六条享受相应的工伤保险待遇。\n\n【依据法条】\n《工伤保险条例》第十四条\n“职工有下列情形之一的，应当认定为工伤：\n（一）在工作时间和工作场所内，因工作原因受到事故伤害的；\n（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；\n（三）在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害的", "trust": 82.5, "cite": 0.5052, "match": true, "rank": 1, "faith": 1.0, "ms": 48099.3, "tools": 0}}}, {"id": "qa012", "prompt": "国家实行劳动者每日工作时间不超过多少小时？", "modes": {"no_rag": {"response": "【结论】\n国家实行劳动者每日工作时间不超过8小时。这是我国标准工时制度的核心规定，旨在保障劳动者的休息权与身体健康。\n\n【法律分析】\n根据我国劳动法律法规，标准工时制度是计算加班费、安排休息休假的基础基准。法律明确规定了每日和每周的工作时间上限，其中每日工作时间不得超过8小时，平均每周工作时间不得超过40小时（注：虽然《劳动法》原文为44小时，但国务院后续规定已调整为40小时，实践中通常以40小时为标准周工时，但每日8小时的上限始终未变）。用人单位若安排劳动者超过此标准工作，需依法支付加班工资或安排补休。这一规定适用于中华人民共和国境内的企业、个体经济组织等用人单位及其劳动者。\n\n【依据法条】\n《中华人民共和国劳动法》第三十六条\n「国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。」", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 1.0, "ms": 3906.2, "tools": 0}, "rag": {"response": "【结论】\n国家实行劳动者每日工作时间不超过八小时。\n\n【法律分析】\n根据我国现行工时制度，标准工作日时长有明确的上限规定。这一规定旨在保障劳动者的休息权与身体健康，是计算加班时间及加班费的基础标准。除非属于非全日制用工等特殊情形，否则用人单位安排劳动者每日工作超过八小时即构成延长工作时间，需遵循严格的协商程序及时长限制。\n\n【依据法条】\n《劳动法》第三十六条\n“国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。”", "trust": 81.9, "cite": 0.4708, "match": true, "rank": 1, "faith": null, "ms": 2924.9, "tools": 0}, "full": {"response": "【结论】\n国家实行劳动者每日工作时间不超过**八小时**。\n\n【法律分析】\n该问题涉及标准工时制度中关于日工作时间的上限规定。根据《劳动法》第三十六条，我国确立的标准工时制度明确限定劳动者每日工作时间不得超过八小时，同时平均每周工作时间不超过四十四小时。该条款适用于一般劳动关系，是用人单位安排工作时间的法定上限。需注意，此处的\"八小时\"为一般性规定，特殊情形下可依法延长工作时间（见《劳动法》第四十一条），但延长亦受严格限制；若为非全日制用工，则适用《劳动合同法》第六十八条的特殊规定，即每日一般不超过四小时。\n\n【依据法条】\n《劳动法》第三十六条：\"国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。\"", "trust": 87.0, "cite": 0.7533, "match": true, "rank": 1, "faith": 0.0, "ms": 4195.3, "tools": 0}, "agent": {"response": "【结论】\n国家实行劳动者每日工作时间不超过八小时。同时，平均每周工作时间不超过四十四小时。\n\n【法律分析】\n根据我国现行劳动法律制度，标准工时制度对劳动者的日工作时长和周工作时长均设定了上限。其中，每日工作时间的法定上限为八小时，这是保障劳动者休息权和健康权的基础性规定。用人单位在安排工作时，必须遵守这一强制性标准，若因生产经营需要延长工作时间，需严格遵循协商程序及法定的延长时限要求，不得随意突破每日八小时的标准工时限制。\n\n【依据法条】\n《劳动法》第三十六条\n“国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。”", "trust": 83.1, "cite": 0.5353, "match": true, "rank": 1, "faith": 1.0, "ms": 8021.1, "tools": 0}}}, {"id": "qa013", "prompt": "劳动争议申请仲裁的时效期间为多久？", "modes": {"no_rag": {"response": "【结论】\n劳动争议申请仲裁的时效期间为一年。该时效期间从当事人知道或者应当知道其权利被侵害之日起计算。\n\n【法律分析】\n根据中国现行法律规定，劳动者或用人单位在发生劳动争议后，若希望通过仲裁途径解决纠纷，必须在法定的时效期间内提出申请。这一时效期间设定为一年，旨在督促权利人及时行使权利，稳定劳动关系和社会秩序。\n\n时效的起算点至关重要，即从当事人“知道或者应当知道”其权利被侵害之日开始计算。这意味着，如果侵权行为发生但当事人并不知情，时效可能尚未开始；反之，即使当事人主观上未察觉，但客观情形足以使其应当察觉时，时效即开始计算。此外，对于劳动关系存续期间因拖欠劳动报酬发生的争议，法律有特殊保护规定，劳动者申请仲裁不受一年时效期间的限制，但应当在劳动关系终止之日起一年内提出。\n\n【依据法条】\n《中华人民共和国劳动争议调解仲裁法》第二十七条\n「劳动争议申请仲裁的时效期间为一年。仲裁时效期间从当事人知道或者应当知道其权利被侵害之日起计算。\n前款规定的仲裁时效，因当事人一方向对方当事人主张权利，或者向有关部门请求权利救济，或者对方当事人同意履行义务而中断。从中断时起，仲裁时效期间重新计算。\n因不", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.8, "ms": 6419.7, "tools": 0}, "rag": {"response": "【结论】\n劳动争议申请仲裁的时效期间为一年。该期间从当事人知道或者应当知道其权利被侵害之日起计算；若劳动关系存续期间因拖欠劳动报酬发生争议，则不受此时效限制，但应在劳动关系终止之日起一年内提出。\n\n【法律分析】\n根据现行有效的《劳动争议调解仲裁法》，劳动争议仲裁的一般时效期间已调整为一年，起算点为当事人知道或应当知道权利被侵害之日。这一规定取代了《劳动法》中关于六十日时效的旧规定，在法律适用上遵循新法优于旧法的原则。此外，法律对拖欠劳动报酬的情形作出了特殊保护，即在劳动关系存续期间，劳动者追索报酬不受一年时效限制，旨在保障劳动者的基本生存权益；但一旦劳动关系终止，劳动者必须在终止之日起一年内主张权利，否则将丧失胜诉权。时效期间还可因当事人主张权利、请求救济或对方同意履行而中断，或因不可抗力等正当理由而中止。\n\n【依据法条】\n《劳动争议调解仲裁法》第二十七条\n“劳动争议申请仲裁的时效期间为一年。仲裁时效期间从当事人知道或者应当知道其权利被侵害之日起计算。\n前款规定的仲裁时效，因当事人一方向对方当事人主张权利，或者向有关部门请求权利救济，或者对方当事人同意履行义务而中断。从中断时起，仲裁时", "trust": 82.4, "cite": 0.4952, "match": true, "rank": 1, "faith": 0.6, "ms": 15868.5, "tools": 0}, "full": {"response": "【结论】\n劳动争议申请仲裁的时效期间一般为**一年**，自当事人知道或者应当知道其权利被侵害之日起计算；但劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受一年时效限制，劳动关系终止的，应当自劳动关系终止之日起一年内提出。\n\n【法律分析】\n仲裁时效的确定需区分一般情形与特殊情形。一般劳动争议适用普通时效规则，即一年的仲裁时效期间，起算点为\"知道或应当知道权利被侵害之日\"，该时效可因当事人主张权利、请求救济或对方同意履行而中断，也可因不可抗力或其他正当理由而中止。对于拖欠劳动报酬争议，法律作出特别规定：劳动关系存续期间劳动者追索劳动报酬不受一年时效限制，以保障劳动者在受雇期间的维权空间；但一旦劳动关系终止，则须在终止之日起一年内提出仲裁申请，此时效为不变期间，不适用劳动关系存续期间的豁免规则。需注意，《劳动法》第八十二条规定的\"六十日\"时效已被《劳动争议调解仲裁法》第二十七条的一年时效所取代，不再适用。\n\n【依据法条】\n《劳动争议调解仲裁法》第二十七条：\"劳动争议申请仲裁的时效期间为一年。仲裁时效期间从当事人知道或者应当知道其权利被侵害之日起计算。\n前款规定的仲裁时效，因当事人", "trust": 85.9, "cite": 0.691, "match": true, "rank": 1, "faith": 1.0, "ms": 8834.5, "tools": 0}, "agent": {"response": "【结论】\n劳动争议申请仲裁的时效期间为一年。该期间从当事人知道或者应当知道其权利被侵害之日起计算，但劳动关系存续期间因拖欠劳动报酬发生争议的，不受此时效限制；劳动关系终止的，应当自终止之日起一年内提出。\n\n【法律分析】\n根据现行法律规定，劳动争议仲裁的一般时效期间已调整为一年，而非旧法规定的六十日。时效起算点为当事人知道或应当知道权利被侵害之日。在特定情形下，时效计算有特殊规则：一是若当事人主张权利、请求救济或对方同意履行，时效中断并重新计算；二是因不可抗力等正当理由无法申请的，时效中止；三是针对拖欠劳动报酬的争议，只要劳动关系尚存，劳动者申请仲裁不受一年时效限制，但若劳动关系终止，则必须在终止后一年内提出。此外，若当事人在仲裁阶段未提出时效抗辩，后续在诉讼中再提出的，法院通常不予支持，除非有新的证据证明时效已届满。\n\n【依据法条】\n《劳动争议调解仲裁法》第二十七条\n“劳动争议申请仲裁的时效期间为一年。仲裁时效期间从当事人知道或者应当知道其权利被侵害之日起计算。\n前款规定的仲裁时效，因当事人一方向对方当事人主张权利，或者向有关部门请求权利救济，或者对方当事人同意履行义务而中断。从中断时", "trust": 82.2, "cite": 0.4832, "match": true, "rank": 1, "faith": 1.0, "ms": 23907.3, "tools": 0}}}, {"id": "qa014", "prompt": "参加基本养老保险的个人，达到法定退休年龄时累计缴费满多少年可以按月领取基本养老金？", "modes": {"no_rag": {"response": "根据中国现行规定，参加基本养老保险的个人，达到法定退休年龄时累计缴费满**15年**，即可按月领取基本养老金。\n\n如果您有关于劳动合同、社保纠纷或其他法律权益的问题，欢迎随时向我咨询。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1485.9, "tools": 0}, "rag": {"response": "根据中国现行规定，参加基本养老保险的个人，达到法定退休年龄时累计缴费满**15年**，即可按月领取基本养老金。\n\n如果您有关于社保权益或劳动纠纷的法律疑问，欢迎随时向我咨询。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1489.0, "tools": 0}, "full": {"response": "参加基本养老保险的个人，达到法定退休年龄时累计缴费**满15年**，可以按月领取基本养老金。\n\n---\n\n如果您有劳动合同、社保缴纳、退休待遇等方面的法律疑问，欢迎随时提出。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1044.5, "tools": 0}, "agent": {"response": "根据中国现行规定，参加基本养老保险的个人，达到法定退休年龄时累计缴费满**15年**，即可按月领取基本养老金。\n\n如果您有关于社保权益纠纷或劳动合同方面的法律疑问，欢迎随时向我咨询。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1772.7, "tools": 0}}}, {"id": "qa015", "prompt": "用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当支付几倍工资？", "modes": {"no_rag": {"response": "【结论】\n用人单位应当每月向劳动者支付**二倍工资**。该责任期间为自用工之日起满一个月的次日至补订书面劳动合同的前一日，最长不超过11个月。\n\n【法律分析】\n根据法律规定，建立劳动关系应当订立书面劳动合同。若用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同，法律推定用人单位存在过错，因此设定了惩罚性赔偿机制。\n具体而言，第一个月为法律允许的协商缔约宽限期，无需支付双倍工资；从第二个月开始（即满一个月的次日）至第十二个月（即不满一年的期间），用人单位需在原正常工资之外，额外支付一倍工资作为赔偿，合计为“二倍工资”。若满一年仍未订立，则视为已订立无固定期限劳动合同，不再适用此条的双倍工资规定，而是进入无固定期限合同的法律调整范畴。\n\n【依据法条】\n《中华人民共和国劳动合同法》第八十二条\n「用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。」", "trust": 91.5, "cite": 1.0, "match": false, "rank": null, "faith": 1.0, "ms": 4590.2, "tools": 0}, "rag": {"response": "【结论】\n用人单位应当每月支付二倍的工资。该责任的起算时间为用工之日起满一个月的次日，截止时间为补订书面劳动合同的前一日。\n\n【法律分析】\n根据法律规定，建立劳动关系应当订立书面劳动合同。若用人单位自用工之日起超过一个月不满一年仍未与劳动者订立书面劳动合同，即构成违法。此时，用人单位除需向劳动者支付正常劳动报酬外，还需额外支付一倍工资作为惩罚性赔偿，合计为每月支付二倍工资。这一义务并非从用工第一天开始计算，而是从用工满一个月后的次日开始，直至双方补订合同的前一日止。如果是因为劳动者故意或重大过失导致未订立，或者存在不可抗力等法定例外情形，用人单位可免除该责任。\n\n【依据法条】\n《劳动合同法》第八十二条\n“用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。”\n\n《劳动合同法实施条例》第六条\n“用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当依照劳动合同法第八十二条的规定向劳动者每月支付两倍的工资，并与劳动者补订书面劳动合同；劳动者不与用人单位订立书面劳动合同的，用人单位应当书面通知劳动者终止劳动关系，并依照劳动合同", "trust": 81.1, "cite": 0.4249, "match": true, "rank": 3, "faith": 1.0, "ms": 14036.6, "tools": 0}, "full": {"response": "【结论】\n用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付**二倍工资**；起算时间为用工之日起满一个月的次日，截止时间为补订书面劳动合同的前一日。\n\n【法律分析】\n该情形下，用人单位承担支付二倍工资的法律责任，属于惩罚性赔偿，旨在督促用人单位及时与劳动者签订书面劳动合同。适用条件为：一是用工事实已成立；二是未订立书面劳动合同的状态持续超过一个月不满一年。若满一年仍未订立，则依据《劳动合同法实施条例》第七条，除支付二倍工资外，还视为已订立无固定期限劳动合同。若因劳动者本人故意或重大过失未订立，用人单位可免责（《劳动争议案件适用法律问题的解释（二）》第七条）。用人单位支付二倍工资的同时，仍负有与劳动者补订书面劳动合同的义务。\n\n【依据法条】\n\n《劳动合同法》第八十二条：\"用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。\"\n\n《劳动合同法实施条例》第六条：\"用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当依照劳动合同法第八十二条的规定向劳动者每月支付两倍的工资，并与劳动者补订", "trust": 87.3, "cite": 0.7685, "match": false, "rank": 3, "faith": 0.75, "ms": 7906.7, "tools": 0}, "agent": {"response": "【结论】\n用人单位应当每月支付二倍工资。支付期间为自用工之日起满一个月的次日至补订书面劳动合同的前一日（若满一年仍未订立，则截止至满一年的前一日）。\n\n【法律分析】\n根据法律规定，建立劳动关系应当订立书面劳动合同。若用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同，即构成违法，需承担惩罚性赔偿责任，即向劳动者每月支付两倍的工资。该二倍工资的起算点为用工满一个月的次日，截止点通常为补订合同的前一日；若持续未签满一年，则视为已订立无固定期限劳动合同，此前期间的二倍工资责任依然成立。除非存在不可抗力或劳动者故意/重大过失等法定免责情形，否则用人单位必须履行该支付义务。\n\n【依据法条】\n《劳动合同法》第八十二条\n“用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。\n\n用人单位违反本法规定不与劳动者订立无固定期限劳动合同的，自应当订立无固定期限劳动合同之日起向劳动者每月支付二倍的工资。”\n\n《劳动合同法实施条例》第六条\n“用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当依照劳动合同法第八十二条的规定向劳动者", "trust": 80.4, "cite": 0.3854, "match": true, "rank": 3, "faith": 0.8, "ms": 66126.5, "tools": 0}}}, {"id": "qa016", "prompt": "能否将自己名下的电话卡、银行账户出租或出借给他人使用？", "modes": {"no_rag": {"response": "绝对不可以。出租、出借或出售个人电话卡、银行账户属于违法行为，极易被用于电信诈骗、洗钱等犯罪活动。这不仅会导致您的账户被冻结、个人征信受损，还可能因触犯“帮助信息网络犯罪活动罪”而承担刑事责任。\n\n如果您遇到涉及账户安全或法律责任的具体疑问，欢迎随时向我咨询。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1960.2, "tools": 0}, "rag": {"response": "绝对不可以。出租或出借电话卡、银行账户不仅违反运营商和银行的服务协议，还极易被用于电信诈骗、洗钱等违法犯罪活动，可能导致您面临信用惩戒、账户冻结，甚至承担刑事责任（如帮助信息网络犯罪活动罪）。\n\n如果您有关于个人信息保护或相关法律责任的疑问，欢迎随时向我咨询。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1821.9, "tools": 0}, "full": {"response": "不可以。将自己的电话卡、银行账户出租或出借给他人使用，可能涉及帮助信息网络犯罪活动罪、掩饰、隐瞒犯罪所得罪等刑事风险，即使不知情，也可能面临账户冻结、信用惩戒等后果。\n\n如果您遇到他人要求借用账户或遇到相关纠纷，欢迎进一步说明情况，我可以帮您分析其中的法律风险。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 1863.4, "tools": 0}, "agent": {"response": "绝对不可以。出租、出借或出售个人电话卡及银行账户属于违法行为，不仅违反电信和金融管理规定，还可能因涉嫌“帮助信息网络犯罪活动罪”而承担刑事责任，同时会导致个人征信受损及金融业务受限。\n\n如果您遇到涉及账户安全或相关法律风险的疑问，欢迎随时向我咨询。", "trust": null, "cite": 1.0, "match": false, "rank": null, "faith": null, "ms": 2009.9, "tools": 0}}}, {"id": "qa017", "prompt": "公民直接向人民法院提起行政诉讼的期限是多久？", "modes": {"no_rag": {"response": "【结论】\n公民直接向人民法院提起行政诉讼的期限通常为知道或者应当知道作出行政行为之日起六个月内。若法律另有特别规定，则依照该特别规定执行。\n\n【法律分析】\n行政诉讼的起诉期限旨在督促权利人及时行使诉权，同时维护行政法律关系的稳定性。对于未经过行政复议程序、直接针对行政行为向法院提起诉讼的情形，法律设定了统一的六个月一般期限。该期限的起算点并非行政行为作出之日，而是公民“知道或者应当知道”该行政行为之日，这体现了对当事人知情权的保护。需要注意的是，如果其他单行法律对特定领域的行政诉讼起诉期限有不同规定（如更短或更长），则遵循“特别法优于一般法”的原则，适用该特别规定。此外，若因不可抗力或其他不属于自身原因耽误期限的，被耽误的时间不计算在起诉期限内，但需在障碍消除后十日内申请延长期限，是否准许由法院决定。\n\n【依据法条】\n《中华人民共和国行政诉讼法》第四十六条\n「公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。\n因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼的，人民", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.6667, "ms": 5120.0, "tools": 0}, "rag": {"response": "【结论】\n公民直接向人民法院提起行政诉讼的期限，一般为自知道或者应当知道作出行政行为之日起六个月内。若涉及不动产案件，自行政行为作出之日起超过二十年，或其他案件自行政行为作出之日起超过五年提起诉讼的，人民法院不予受理。\n\n【法律分析】\n根据《行政诉讼法》的规定，行政诉讼的起诉期限主要遵循“六个月”的一般规则，该期限从公民知道或者应当知道行政行为作出之日开始计算。这一规定旨在督促当事人及时行使诉权，同时保障行政法律关系的稳定性。\n\n此外，法律设定了最长保护期限作为例外和补充：对于因不动产提起诉讼的案件，最长保护期为行政行为作出之日起二十年；对于其他案件，最长保护期为五年。一旦超过这些最长时限，无论当事人是否知晓行政行为，人民法院均不再受理。需要注意的是，如果其他法律对起诉期限有不同规定的，则优先适用特别规定。\n\n【依据法条】\n《行政诉讼法》第四十六条\n“公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。\n\n因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼的，人民法院不", "trust": 84.9, "cite": 0.6344, "match": true, "rank": 1, "faith": 1.0, "ms": 11612.4, "tools": 0}, "full": {"response": "【结论】\n公民直接向人民法院提起行政诉讼的期限，应当自知道或者应当知道作出行政行为之日起**六个月内**提出；法律另有规定的除外。因不动产提起诉讼的案件自行政行为作出之日起超过二十年、其他案件超过五年的，人民法院不予受理。\n\n【法律分析】\n该问题涉及行政诉讼的起诉期限制度。直接起诉的六个月期限属于一般规定，起算点为原告\"知道或者应当知道\"行政行为之日，体现了对行政相对人及时行使诉权的督促。二十年和五年的最长保护期限属于绝对不变期间，自行政行为作出之日起算，不受当事人是否知晓的影响，旨在维护行政法律关系的稳定性。需注意，该六个月期限与申请行政机关履行职责后起诉的期限（两个月履行期）属于不同制度，后者适用于行政机关不作为的情形。\n\n【依据法条】\n《行政诉讼法》第四十六条：\"公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。\n\n因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼的，人民法院不予受理。\"", "trust": 85.9, "cite": 0.69, "match": true, "rank": 1, "faith": 1.0, "ms": 5505.3, "tools": 0}, "agent": {"response": "【结论】\n公民直接向人民法院提起行政诉讼的期限，应当自知道或者应当知道作出行政行为之日起六个月内提出。若因不动产提起诉讼，自行政行为作出之日起超过二十年，或其他案件超过五年提起诉讼的，人民法院不予受理。\n\n【法律分析】\n根据《行政诉讼法》的规定，行政诉讼的起诉期限主要分为一般期限和最长保护期限。一般期限以当事人“知道或者应当知道”行政行为之日为起算点，期限为六个月，这旨在督促权利人及时行使诉权。同时，为了维护行政法律关系的稳定性，法律设定了绝对的最长起诉期限：涉及不动产的案件为二十年，其他案件为五年，该期限自行政行为作出之日起计算，无论当事人是否知晓，超过该期限法院均不予受理。此外，若法律对特定领域的起诉期限另有规定，则优先适用特别规定。\n\n【依据法条】\n《行政诉讼法》第四十六条\n“公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。\n\n因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼的，人民法院不予受理。”", "trust": 82.8, "cite": 0.5215, "match": true, "rank": 1, "faith": 1.0, "ms": 18391.7, "tools": 0}}}, {"id": "qa018", "prompt": "公司不能清偿到期债务时，债权人能否要求已认缴出资但未届出资期限的股东提前缴纳出资？", "modes": {"no_rag": {"response": "【结论】\n可以。当公司不能清偿到期债务时，债权人有权要求已认缴出资但未届出资期限的股东在其未缴出资范围内对公司债务承担补充赔偿责任，即加速到期。\n\n【法律分析】\n在注册资本认缴制下，股东享有期限利益，原则上应按章程约定的期限缴纳出资。然而，为平衡股东期限利益与债权人保护，法律规定了“加速到期”制度。当公司作为债务人无法清偿到期债务，且具备破产原因但不申请破产，或者在执行程序中法院因无财产可供执行而裁定终结本次执行程序时，股东的出资义务视为提前到期。此时，债权人可以直接起诉未届出资期限的股东，要求其在未出资本息范围内对公司债务不能清偿的部分承担补充赔偿责任。这一规则旨在防止股东利用长期认缴期限逃避债务，确保公司资本充实以保障交易安全。\n\n【依据法条】\n《中华人民共和国公司法》第五十四条\n「公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。」\n\n《最高人民法院关于适用〈中华人民共和国公司法〉若干问题的规定（三）》第十三条第二款\n「公司债权人请求未履行或者未全面履行出资义务的股东在未出资本息范围内对公司债务不能清偿的部分承担补充赔偿责任的，", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.6667, "ms": 5334.8, "tools": 0}, "rag": {"response": "【结论】\n可以。当公司不能清偿到期债务时，已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。\n\n【法律分析】\n根据法律规定，股东的出资义务通常受公司章程规定的出资期限保护（即享有期限利益）。但在特定情形下，为保护债权人利益，法律设立了出资加速到期制度。具体而言，当公司出现“不能清偿到期债务”的情形时，法律明确赋予已到期债权的债权人直接请求权，要求其向未届出资期限的股东主张提前履行出资义务。这一规定突破了股东原有的期限利益，旨在确保公司具备足够的偿债能力以保障债权人的合法权益。此时，债权人无需等待出资期限届满，即可依据法定条件行使该权利。\n\n【依据法条】\n《公司法》第五十四条\n“公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。”", "trust": 84.8, "cite": 0.6329, "match": true, "rank": 1, "faith": 0.75, "ms": 5869.3, "tools": 0}, "full": {"response": "【结论】\n可以。公司不能清偿到期债务时，已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。\n\n【法律分析】\n该问题涉及2023年修订的《公司法》确立的股东出资义务加速到期制度。在此情形下，权利主体为\"已到期债权的债权人\"，义务主体为\"已认缴出资但未届出资期限的股东\"，适用条件是公司\"不能清偿到期债务\"。一旦该条件成就，债权人即取得请求权，可直接要求相关股东提前履行出资义务，无需等待公司章程规定的出资期限届满。这一规定突破了原《公司法》及司法解释中原则上仅在破产、清算程序中适用加速到期的限制，强化了债权人保护，也体现了注册资本认缴制下对股东出资责任的合理约束。该权利与公司本身享有的权利并行，即公司自身亦可依据同条向该等股东主张提前缴纳出资。\n\n【依据法条】\n《公司法》第五十四条：\"公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。\"", "trust": 86.6, "cite": 0.7298, "match": true, "rank": 1, "faith": 1.0, "ms": 11548.4, "tools": 0}, "agent": {"response": "【结论】\n可以。当公司不能清偿到期债务时，已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。\n\n【法律分析】\n根据《公司法》的相关规定，股东的出资义务虽通常受公司章程规定的期限保护，但在特定情形下该期限利益将丧失。具体而言，当公司出现“不能清偿到期债务”的情形时，法律赋予了债权人直接请求权。此时，不仅公司自身，包括已到期债权的债权人在内，均有权突破原有的出资期限限制，要求那些已经认缴但尚未到达约定缴纳日期的股东提前履行出资义务，以保障债权人的合法权益及公司的偿债能力。这一规定旨在防止股东利用期限利益逃避债务，确保公司资本充实。\n\n【依据法条】\n《公司法》第五十四条\n“公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。”", "trust": 85.9, "cite": 0.6925, "match": true, "rank": 1, "faith": 1.0, "ms": 18512.5, "tools": 0}}}, {"id": 】\n因实施家庭暴力导致离婚的，无过错方有权请求损害赔偿。该请求原则上须在离婚诉讼中同时提出，但无过错方作为被告且不同意离婚的，可在离婚后单独提起诉讼。\n\n【法律分析】\n家庭暴力的受害方作为无过错方，其损害赔偿请求权建立在《民法典》第一千零九十一条第三项明确列举的法定情形之上。该权利的成立需满足三项要件：一是存在家庭暴力行为，二是该行为导致离婚，三是请求主体为无过错方。若双方均存在该条规定的过错情形，则相互抵销，任何一方均不得主张赔偿。关于行使权利的时点，需区分原告与被告身份：无过错方作为原告起诉离婚的，必须在离婚诉讼中一并提出赔偿请求；无过错方作为被告且不同意离婚的，则享有程序上的缓冲，可在离婚后另行单独起诉。此外，若选择协议离婚，未明确放弃赔偿请求的，离婚后仍可向法院提出。值得注意的是，若法院判决不准离婚，或婚姻关系存续期间单独起诉赔偿的，法院均不予支持或受理，体现了离婚损害赔偿以\"离婚\"为前置条件的制度设计。\n\n【依据法条】\n《民法典》第一千零九十一条：\"有下列情形之一，导致离婚的，无过错方有权请求损害赔偿：（一）重婚；（二）与他人同居；（三）实施家庭暴力；（四）虐待、遗弃家", "trust": 85.4, "cite": 0.6647, "match": true, "rank": 1, "faith": 0.8, "ms": 11638.8, "tools": 0}, "agent": {"response": "【结论】\n有权。因实施家庭暴力导致离婚的，无过错方有权依据《民法典》第一千零九十一条请求损害赔偿。\n\n【法律分析】\n根据法律规定，实施家庭暴力是导致离婚的法定过错情形之一。在此情形下，法律赋予无过错方请求损害赔偿的权利，以弥补其受到的伤害。该赔偿责任的主体为无过错方的配偶，且该请求通常需在离婚诉讼中一并提出，或在特定条件下单独提起诉讼。若双方均存在过错，则法院不支持损害赔偿请求；若判决不准离婚，也不支持该赔偿请求。\n\n【依据法条】\n《民法典》第一千零九十一条\n“有下列情形之一，导致离婚的，无过错方有权请求损害赔偿：\n\n（一）重婚；\n\n（二）与他人同居；\n\n（三）实施家庭暴力；\n\n（四）虐待、遗弃家庭成员；\n\n（五）有其他重大过错。”\n\n《民法典婚姻家庭编解释（一）》第八十七条\n“承担民法典第一千零九十一条规定的损害赔偿责任的主体，为离婚诉讼当事人中无过错方的配偶。\n\n人民法院判决不准离婚的案件，对于当事人基于民法典第一千零九十一条提出的损害赔偿请求，不予支持。\n\n在婚姻关系存续期间，当事人不起诉离婚而单独依据民法典第一千零九十一条提起损害赔偿请求的，人民法院不予受理。”\n\n《民法典婚姻", "trust": 84.5, "cite": 0.6115, "match": true, "rank": 1, "faith": 1.0, "ms": 21195.2, "tools": 0}}}, {"id": "qa022", "prompt": "违法行为在几年内未被发现的，不再给予行政处罚？", "modes": {"no_rag": {"response": "【结论】\n一般情况下，违法行为在**二年**内未被发现的，不再给予行政处罚；若涉及公民生命健康安全、金融安全且有危害后果的，期限延长至**五年**。\n\n【法律分析】\n行政处罚的追究时效旨在平衡行政效率与法律秩序的稳定性。根据法律规定，行政机关对违法行为的查处权受时间限制，该期限从违法行为发生之日起计算；如果违法行为有连续或者继续状态的，则从行为终了之日起计算。这一规定意味着，一旦超过法定的追究时效（通常为二年，特定严重情形为五年），行政机关即丧失对该违法行为进行处罚的权力，不得再作出行政处罚决定。需要注意的是，这里强调的是“未被发现”，若已在期限内立案或发现，则不受此时效限制。\n\n【依据法条】\n《中华人民共和国行政处罚法》第三十六条\n「违法行为在二年内未被发现的，不再给予行政处罚；涉及公民生命健康安全、金融安全且有危害后果的，上述期限延长至五年。法律另有规定的除外。\n前款规定的期限，从违法行为发生之日起计算；违法行为有连续或者继续状态的，从行为终了之日起计算。」", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.5, "ms": 4922.8, "tools": 0}, "rag": {"response": "【结论】\n一般情况下，违法行为在二年内未被发现的，不再给予行政处罚。若涉及公民生命健康安全、金融安全且有危害后果的，该期限延长至五年。\n\n【法律分析】\n根据 】\n从建筑物中抛掷物品造成他人损害的，首先由侵权人依法承担侵权责任；若经调查难以确定具体侵权人，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人给予补偿。此外，物业服务企业等建筑物管理人未采取必要安全保障措施的，也应依法承担相应侵权责任。\n\n【法律分析】\n根据法律规定，高空抛物致害的责任承担遵循“侵权人优先、可能加害人补偿、管理人过错担责”的逻辑。首先，若能查明具体侵权人，则由该侵权人直接承担侵权责任。其次，在经公安等机关调查后仍难以确定具体侵权人的情况下，为了保护受害人权益，法律规定由“可能加害的建筑物使用人”给予补偿，但这些人若能证明自己不是侵权人（如证明事发时家中无人等），则可免除补偿义务。这些使用人在补偿后，有权向最终查明的侵权人追偿。最后，物业服务企业等建筑物管理人负有采取必要安全措施防止此类情形发生的义务，若其未履行该义务，需依法承担未履行安全保障义务的侵权责任。\n\n【依据法条】\n《民法典》第一千二百五十四条\n“禁止从建筑物中抛掷物品。从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害的，由侵权人依法承担侵权责任；经调查难以确定具体侵权人的，除能够证明自己不", "trust": 81.9, "cite": 0.472, "match": true, "rank": 1, "faith": 0.4, "ms": 26479.8, "tools": 0}}}, {"id": "qa027", "prompt": "用人单位未及时足额支付劳动报酬的，劳动者可以解除劳动合同吗？", "modes": {"no_rag": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者有权单方解除劳动合同，且无需提前30日通知，并可要求用人单位支付经济补偿。\n\n【法律分析】\n根据中国劳动法律法规，及时足额支付劳动报酬是用人单位的核心法定义务。当用人单位违反该义务时，构成了对劳动合同的根本违约，法律赋予劳动者“被迫解除权”。\n\n具体而言，劳动者依据此理由解除合同属于“即时解除”，即不需要像个人原因辞职那样提前30日书面通知用人单位，只需通知用人单位即可解除劳动关系。此外，由于解除原因是用人单位过错所致，劳动者在解除合同后，有权依据法律规定要求用人单位支付经济补偿金（通常按工作年限计算，每满一年支付一个月工资）。这一制度设计旨在保护处于弱势地位的劳动者，防止其因被拖欠工资而陷入被动。\n\n【依据法条】\n《中华人民共和国劳动合同法》第三十八条\n「用人单位有下列情形之一的，劳动者可以解除劳动合同：\n（一）未按照劳动合同约定提供劳动保护或者劳动条件的；\n（二）未及时足额支付劳动报酬的；\n（三）未依法为劳动者缴纳社会保险费的；\n（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；\n（五）因本法第二十六条第一款规定", "trust": 91.5, "cite": 1.0, "match": false, "rank": null, "faith": 0.6667, "ms": 8275.6, "tools": 0}, "rag": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者有权依据《劳动合同法》第三十八条单方解除劳动合同。\n\n【法律分析】\n根据法律规定，及时足额支付劳动报酬是用人单位的法定义务。当用人单位违反该义务，出现拖欠或未足额支付劳动报酬的情形时，构成了劳动者单方解除劳动合同的法定事由。此时，劳动者无需与用人单位协商一致，即可直接行使解除权。这一规定旨在保护劳动者获取劳动报酬的核心权益，赋予其在雇主违约时的救济途径。\n\n【依据法条】\n《劳动合同法》第三十八条\n原文：用人单位有下列情形之一的，劳动者可以解除劳动合同:\n\n（一）未按照劳动合同约定提供劳动保护或者劳动条件的；\n\n（二）未及时足额支付劳动报酬的；\n\n（三）未依法为劳动者缴纳社会保险费的；\n\n（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；\n\n（五）因本法第二十六条第一款规定的情形致使劳动合同无效的；\n\n（六）法律、行政法规规定劳动者可以解除劳动合同的其他情形。\n\n用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的，或者用人单位违章指挥、强令冒险作业危及劳动者人身安全的，劳动者可以立即解除劳动合同，不需事先告", "trust": 85.5, "cite": 0.6678, "match": false, "rank": 5, "faith": 1.0, "ms": 8592.4, "tools": 0}, "full": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者可以依据《劳动合同法》第三十八条解除劳动合同，且无需用人单位同意。\n\n【法律分析】\n本案核心在于劳动者因用人单位拖欠工资而享有的法定解除权。与第三十六条\"协商一致解除\"不同，第三十八条赋予劳动者单方解除权：只要用人单位存在\"未及时足额支付劳动报酬\"等法定情形，劳动者即可主动解除劳动合同，无需与用人单位协商或征得其同意。该解除权的法律效果与《劳动法》第二十四条、第二十八条规定的协商解除存在本质区别——后者需双方合意且涉及经济补偿的法定支付义务，而第三十八条情形下的解除虽同样可能产生经济补偿问题，但解除权的成立不以协商为前提，劳动者享有完全主动权。此外，第三十条虽规定了支付令救济途径，但并不影响劳动者同时行使解除权，二者可并行适用。\n\n【依据法条】\n\n《劳动合同法》第三十八条\n\n\"用人单位有下列情形之一的，劳动者可以解除劳动合同:\n\n（一）未按照劳动合同约定提供劳动保护或者劳动条件的；\n\n（二）未及时足额支付劳动报酬的；\n\n（三）未依法为劳动者缴纳社会保险费的；\n\n（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；\n\n（", "trust": 86.7, "cite": 0.733, "match": false, "rank": 5, "faith": null, "ms": 48323.7, "tools": 0}, "agent": {"response": "【结论】\n可以。用人单位未及时足额支付劳动报酬的，劳动者有权依据《劳动合同法》第三十八条单方解除劳动合同。\n\n【法律分析】\n及时足额支付劳动报酬是用人单位的法定义务。当用人单位违反该义务时，构成了《劳动合同法》第三十八条规定的法定解除情形。此时，劳动者享有单方解除权，无需与用人单位协商一致即可提出解除劳动合同。这与双方协商一致解除（参考法条中的《劳动合同法》第三十六条及《劳动法》第二十四条）不同，后者需要双方达成合意，而前者是基于用人单位违法情形赋予劳动者的救济权利。此外，根据《劳动法》第二十八条，若因用人单位原因导致合同解除，劳动者通常还有权获得经济补偿。\n\n【依据法条】\n《劳动合同法》第三十八条\n“用人单位有下列情形之一的，劳动者可以解除劳动合同:\n\n（一）未按照劳动合同约定提供劳动保护或者劳动条件的；\n\n（二）未及时足额支付劳动报酬的；\n\n（三）未依法为劳动者缴纳社会保险费的；\n\n（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；\n\n（五）因本法第二十六条第一款规定的情形致使劳动合同无效的；\n\n（六）法律、行政法规规定劳动者可以解除劳动合同的其他情形。\n\n用人单位以", "trust": 85.6, "cite": 0.6771, "match": false, "rank": 5, "faith": 0.5, "ms": 9617.4, "tools": 0}}}, {"id": "qa028", "prompt": "职工醉酒后在工作时间和工作场所内受到事故伤害，能否认定为工伤？", "modes": {"no_rag": {"response": "【结论】\n职工醉酒后在工作时间和工作场所内受到事故伤害，**不能认定为工伤**。根据中国现行法律规定，“醉酒”属于法定的排除工伤认定的情形之一，无论事故发生的时间或地点是否符合常规工伤认定标准。\n\n【法律分析】\n工伤认定遵循“无过错补偿”原则，但法律明确规定了若干例外情形以维护社会公共秩序和道德底线。在本案中，虽然职工受伤满足“工作时间”和“工作场所”这两个通常构成工伤的时空要素，但其受伤的直接原因或伴随状态涉及“醉酒”。\n\n依据《工伤保险条例》的规定，醉酒导致的伤亡被明确列为不得认定为工伤或者视同工伤的情形。这一规定的立法目的在于防止职工因自身严重违反法律法规或社会公德的行为（如酗酒）而将风险转嫁给工伤保险基金。因此，只要社会保险行政部门或司法机关确认职工在事故发生时处于醉酒状态（通常以血液酒精含量检测报告等证据为准），即便其是在履行工作职责期间受伤，也无法获得工伤认定及相应的工伤保险待遇。需要注意的是，这里的“醉酒”需达到法定标准，且与伤害结果之间通常需存在因果关系或被法律直接推定为排除事由。\n\n【依据法条】\n《工伤保险条例》第十六条\n「职工符合本条例第十四条、第十五条的规定，但是", "trust": 91.5, "cite": 1.0, "match": true, "rank": null, "faith": 0.75, "ms": 5708.2, "tools": 0}, "rag": {"response": "【结论】\n不能认定为工伤。根据法律规定，职工因醉酒导致本人在工作中伤亡的，属于法定排除情形，不得认定为工伤或视同工伤，因此无法享受工伤保险待遇。\n\n【法律分析】\n虽然职工是在工作时间和工作场所内受到事故伤害，表面上符合《工伤保险条例》第十四条关于一般工伤认定的时空要素，但工伤认定存在法定的排除情形。依据《社会保险法》和《工伤保险条例》的明确规定，“醉酒”是导致伤亡的特定免责事由。只要职工的伤亡是由醉酒导致的，即便发生在工作期间和工作场所，法律也强制规定不得认定为工伤。这意味着该职工无法通过工伤认定程序，进而无法依据《社会保险法》第三十六条享受相应的工伤保险待遇或伤残待遇。\n\n【依据法条】\n《社会保险法》第三十七条\n“职工因下列情形之一导致本人在工作中伤亡的，不认定为工伤：\n（一）故意犯罪；\n（二）醉酒或者吸毒；\n（三）自残或者自杀；\n（四）法律、行政法规规定的其他情形。”\n\n《工伤保险条例》第十六条\n“职工符合本条例第十四条、第十五条的规定，但是有下列情形之一的，不得认定为工伤或者视同工伤：\n（一）故意犯罪的；\n（二）醉酒或者吸毒的；\n（三）自残或者自杀的。”", "trust": 80.9, "cite": 0.4147, "match": true, "rank": 2, "faith": 1.0, "ms": 17636.4, "tools": 0}, "full": {"response": "【结论】\n职工具备\"工作时间、工作场所、工作原因\"三要素，但因醉酒导致事故伤害的，不得认定为工伤，不能享受工伤保险待遇。\n\n【法律分析】\n《工伤保险条例》第十四条确立了工伤认定的\"三工\"标准，职工具备该条第（一）项\"工作时间和工作场所内，因工作原因受到事故伤害\"的构成要件，本可认定为工伤。然而，《工伤保险条例》第十六条作为排除性条款，明确规定即使职工符合第十四条、第十五条的工伤认定条件，只要存在\"醉酒或者吸毒\"等法定情形，即不得认定为工伤或者视同工伤。因此，醉酒属于法定的工伤排除事由，一旦确认职工处于醉酒状态，则阻断工伤认定，其法律后果是职工无法依据《社会保险法》第三十六条享受工伤保险待遇及伤残待遇。该排除条款的适用不以用人单位存在过错为前提，亦不因职工醉酒与事故发生是否存在因果关系而有所区别，属于绝对排除情形。\n\n【依据法条】\n\n《工伤保险条例》第十四条：\"职工有下列情形之一的，应当认定为工伤：（一）在工作时间和工作场所内，因工作原因受到事故伤害的；（二）工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；（三）在工作时间和工作场所内，因履行工作职责受到暴力", "trust": 83.5, "cite": 0.5592, "match": true, "rank": 2, "faith": 0.8, "ms": 73307.1, "tools": 0}, "agent": {"response": "【结论】\n职工醉酒后在工作时间和工作场所内受到事故伤害，**不能认定为工伤**。根据法律规定，醉酒属于法定的工伤认定排除情形，即使伤害发生在工作时间和工作场所，也不得认定为工伤。\n\n【法律分析】\n工伤认定通常遵循“三工”原则（工作时间、工作场所、工作原因），但在存在法定排除情形时，即便符合“三工”要素也不能认定。本案中，职工虽然是在工作时间和工作场所内受到事故伤害，表面上可能符合《工伤保险条例》第十四条关于一般工伤认定的情形，但其处于“醉酒”状态。\n\n根据《社会保险法》第三十七条和《工伤保险条例》第十六条的明确规定，“醉酒”是导致本人在工作中伤亡的法定排除情形之一。这意味着，只要职工的伤害是由醉酒导致的，或者在醉酒状态下发生的伤亡，法律直接规定不得认定为工伤或视同工伤。因此，醉酒这一情节阻断了工伤认定的成立，该职工无法享受工伤保险待遇。\n\n【依据法条】\n《社会保险法》第三十七条\n“职工因下列情形之一导致本人在工作中伤亡的，不认定为工伤：\n（一）故意犯罪；\n（二）醉酒或者吸毒；\n（三）自残或者自杀；\n（四）法律、行政法规规定的其他情形。”\n\n《工伤保险条例》第十六条\n“职工符合本条例第十", "trust": 79.2, "cite": 0.3182, "match": true, "rank": 2, "faith": 1.0, "ms": 29677.5, "tools": 0}}}, {"id": "qa029", "prompt": "解除劳动合同的经济补偿金按什么标准计算？", "modes": {"no_rag": {"response": "【结论】\n经济补偿金按劳动者在本单位工作的年限，每满一年支   const el = document.getElementById("c_ablation");
  if (!D.ablation.length) { el.innerHTML = "无消融数据"; return; }
  const labels = D.ablation.map(r => D.modeLabel[r.summary.mode] || r.summary.mode);
  const series = [
    { name: "答案匹配率", key: "answer_match_rate" },
    { name: "引用召回率", key: "gold_citation_recall" },
    { name: "忠实度", key: "avg_faithfulness" },
    { name: "信任分÷100", key: "avg_trust_score", div: 100 },
  ].map(m => ({
    name: m.name, type: "bar", barMaxWidth: 42,
    data: D.ablation.map(r => {
      const v = r.summary[m.key];
      return v == null ? null : +(m.div ? v / m.div : v).toFixed(4);
    }),
  }));
  echarts.init(el).setOption({
    tooltip: { trigger: "axis" }, legend: {},
    xAxis: { type: "category", data: labels },
    yAxis: { type: "value", max: 1 },
    series,
  });
})();

// ---------- 图 1 雷达 ----------
(function () {
  const el = document.getElementById("c_radar");
  const withRadar = D.ablation.filter(r => r.summary.avg_radar && Object.keys(r.summary.avg_radar).length);
  if (!withRadar.length) { el.innerHTML = "无雷达数据"; return; }
  const dims = Object.keys(withRadar[0].summary.avg_radar);
  echarts.init(el).setOption({
    tooltip: {}, legend: { data: withRadar.map(r => D.modeLabel[r.summary.mode] || r.summary.mode) },
    radar: { indicator: dims.map(d => ({ name: d, max: 100 })), radius: "65%" },
    series: [{
      type: "radar",
      data: withRadar.map(r => ({
        name: D.modeLabel[r.summary.mode] || r.summary.mode,
        value: dims.map(d => r.summary.avg_radar[d]),
      })),
    }],
  });
})();

// ---------- 图 3 成本-效果散点 ----------
(function () {
  const el = document.getElementById("c_scatter");
  if (!D.models.length) { el.innerHTML = "无多模型数据"; return; }
  const pts = D.models.map(r => {
    const s = r.summary;
    const costPerQ = s.count ? s.est_cost_yuan / s.count : 0;
    return { name: s.model, value: [+costPerQ.toFixed(5), s.avg_trust_score] };
  });
  echarts.init(el).setOption({
    tooltip: { formatter: p => `${p.name}<br>单题成本：${p.value[0]} 元<br>信任分：${p.value[1]}` },
    xAxis: { name: "单题成本（元）", type: "value" },
    yAxis: { name: "综合信任分", type: "value", min: v => Math.floor(v.min - 5) },
    series: [{
      type: "scatter", symbolSize: 18,
      data: pts,
      label: { show: true, position: "top", formatter: p => p.name, fontSize: 11 },
    }],
  });
})();

// ---------- 图 4 热力图 ----------
(function () {
  const el = document.getElementById("c_heat");
  if (!D.models.length) { el.innerHTML = "无多模型数据"; return; }
  const mets = D.heatMetrics;
  const cells = [];
  D.models.forEach((r, yi) => {
    const s = r.summary;
    mets.forEach(([key, , ], xi) => {
      let v = s[key];
      if (key === "avg_trust_score") v = v == null ? null : v / 100;
      cells.push([xi, yi, v == null ? "-" : +v.toFixed(3)]);
    });
  });
  echarts.init(el).setOption({
    tooltip: { formatter: p => `${D.models[p.value[1]].model} · ${mets[p.value[0]][1]}：${p.value[2]}` },
    grid: { left: 140 },
    xAxis: { type: "category", data: mets.map(m => m[1]) },
    yAxis: { type: "category", data: D.models.map(r => r.model) },
    visualMap: { min: 0, max: 1, calculable: true, orient: "horizontal", left: "center",
                 inRange: { color: ["#f6d5d5", "#fdf3c9", "#bfe3c0", "#2f9e44"] } },
    series: [{ type: "heatmap", data: cells, label: { show: true, fontSize: 10 } }],
  });
})();

// ---------- 图 5 检索命中率 ----------
(function () {
  const el = document.getElementById("c_hit");
  const cats = [], h1 = [], h3 = [], h5 = [];
  for (const r of D.ablation) {
    const s = r.summary;
    if (s.hit_at_1 == null) continue;
    cats.push(D.modeLabel[s.mode] || s.mode);
    h1.push(s.hit_at_1); h3.push(s.hit_at_3); h5.push(s.hit_at_5);
  }
  for (const r of D.retrieval) {
    const s = r.summary;
    cats.push("retrieval_gold(35题)");
    h1.push(s.hit_at_1); h3.push(s.hit_at_3); h5.push(s.hit_at_5);
  }
  if (!cats.length) { el.innerHTML = "无检索数据"; return; }
  echarts.init(el).setOption({
    tooltip: { trigger: "axis" }, legend: {},
    xAxis: { type: "category", data: cats },
    yAxis: { type: "value", max: 1 },
    series: [
      { name: "Hit@1", type: "bar", data: h1 },
      { name: "Hit@3", type: "bar", data: h3 },
      { name: "Hit@5", type: "bar", data: h5 },
    ],
  });
})();

// ---------- 图 6 逐题卡 ----------
(function () {
  const box = document.getElementById("cards");
  if (!D.perQuestion.length) { box.innerHTML = "无逐题数据"; return; }
  const badge = (ok, t) => ok == null ? `<span class="badge na">${t}:—</span>`
    : `<span class="badge ${ok ? "ok" : "bad"}">${t}:${ok ? "✓" : "✗"}</span>`;
  box.innerHTML = D.perQuestion.map(q => `
    <div class="qcard">
      <h3>${q.id} · ${q.prompt}</h3>
      <div class="modes">
        ${D.modes.map(m => {
          const c = q.modes[m];
          if (!c) return "";
          return `<div class="mcell"><b>${D.modeLabel[m]}</b><br>
            ${badge(c.match, "答案")}
            ${c.cite == null ? `<span class="badge na">引用:—</span>` : badge(c.cite >= 0.65, "引用")}
            <span class="badge na">信任:${c.trust ?? "—"}</span>
            <span class="badge na">rank:${c.rank ?? "—"}</span>
            ${c.tools > 0 ? `<span class="badge ok">工具:${c.tools}</span>` : ""}
            <div class="resp">${(c.response || "").replace(/</g, "&lt;")}</div></div>`;
        }).join("")}
      </div>
    </div>`).join("");
})();
</script>
</body>
</html>
