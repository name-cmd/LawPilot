<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="律策智枢 LawPilot — 面向智慧司法的多智能体协同与全域可信核验问答平台" />
    <title>律策智枢 LawPilot</title>
    <!-- 防闪烁：若之前选择过暗色模式，在 JS 加载前就加好 .dark 类 -->
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('lawtrust_settings_v1') || '{}')
        if (saved.theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
